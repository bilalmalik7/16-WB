name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - 'www/fonts/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write  # lets the build publish the APK as a release download

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android project
        run: npm run build && npx cap sync android

      - name: Prepare upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release bundle will be signed with your upload key."
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret set. The release bundle will be unsigned; see PLAYSTORE.md."
          fi

      # Android only installs an update over an app signed with the same key, so keep one debug key for every build.
      - name: Reuse the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK and release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload debug APK (install on your phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: numberdar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release bundle (upload to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: numberdar-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Publish APK to the phone download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Numberdar.apk
          notes="Open this page on your Android phone and tap Numberdar.apk to install. Build ${{ github.run_number }} (version 1.0.${{ github.run_number }}) from commit ${GITHUB_SHA::7}."
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "Numberdar for Android" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
          gh release edit android-latest --notes "$notes"
          gh release upload android-latest Numberdar.apk --clobber
