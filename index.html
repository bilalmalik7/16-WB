<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rise of the Numberdar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@500&display=swap">
<style>
/* Layout: one-column game console. Scene window framed in truck-art trim, dialogue + choices below, stat ledger above. Single dark "dusk at the Dera" look by design. */
:root{
  --night:#15111f; --panel:#1f1828; --panel-2:#291f33; --line:#3d2f48;
  --gold:#e9b44c; --rose:#d4506a; --teal:#2fa38f; --parch:#f4e7cc; --muted:#b8a78f;
  --izzat:#e9b44c; --khauf:#e0607a; --paisa:#8ccf73; --taluq:#5db3e2;
  --f-display:'Rozha One', Georgia, 'Times New Roman', serif;
  --f-body:'Hind', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-urdu:'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
  --trim:repeating-linear-gradient(90deg,var(--gold) 0 14px,var(--rose) 14px 28px,var(--teal) 28px 42px,var(--parch) 42px 46px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1100px 560px at 50% -12%,#3b2342 0%,var(--night) 62%) var(--night);color:var(--parch);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:grid;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.1;color:var(--gold);text-wrap:balance}
.brand .ur{font-family:var(--f-urdu);font-size:15px;color:var(--muted);direction:rtl}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.pill b{color:var(--parch);font-weight:600}
.btn-s{cursor:pointer}
.btn-s:hover{border-color:var(--gold);color:var(--parch)}

/* stat ledger */
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{--c:var(--gold);position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;min-width:0}
.stat .lbl{display:flex;justify-content:space-between;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .lbl i{font-style:normal;font-family:var(--f-urdu);letter-spacing:0;text-transform:none;font-size:12px;line-height:1}
.stat .val{font-family:var(--f-display);font-size:24px;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.25}
.bar{height:6px;background:#0007;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.delta{position:absolute;right:10px;top:26px;font-family:var(--f-display);font-size:20px;pointer-events:none;animation:floatUp 1.8s ease-out forwards}
.delta.up{color:var(--paisa)} .delta.dn{color:var(--khauf)}
.subhud{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.subhud b{color:var(--parch);font-weight:500}
.loy{display:inline-block;width:70px;height:5px;border-radius:3px;background:#0007;vertical-align:middle;margin-left:6px;overflow:hidden}
.loy i{display:block;height:100%;background:var(--teal);transition:width .9s}

/* scene window */
.stage{position:relative;aspect-ratio:1200/560;max-width:100%;border-radius:14px;overflow:hidden;background:#0c0a12;box-shadow:0 0 0 2px var(--gold),0 0 0 6px var(--night),0 0 0 8px var(--teal),0 24px 60px #000a}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--trim);opacity:.9}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#world{transform-origin:0 0;transition:transform 1.8s cubic-bezier(.45,0,.2,1)}
.loc{position:absolute;left:12px;top:12px;z-index:3;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:#0009;border:1px solid #fff2;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:var(--ray,.5);background:linear-gradient(115deg,transparent 30%,#ffd9902a 42%,transparent 48%,#ffd99020 56%,transparent 64%);animation:rays 9s ease-in-out infinite alternate;transition:opacity 1.5s}
.leaves{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leaf{position:absolute;top:-5%;width:10px;height:6px;border-radius:0 70% 0 70%;background:#6f8f3a;animation:leafFall var(--t,9s) linear infinite,leafSpin 2.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4}
.fade.on{opacity:1}
.rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;background:repeating-linear-gradient(105deg,transparent 0 9px,#cfe3ff30 9px 10px);background-size:120px 120px;animation:rain .35s linear infinite}
.rain.on{opacity:1}

/* svg actors */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite}
.cheer{animation:cheer .9s ease-in-out infinite}
.scan{transform-box:fill-box;transform-origin:50% 100%;animation:scan 7s steps(1) infinite}
.arm,.leg,.lg{transform-box:view-box}
.sip{animation:sip 5s ease-in-out infinite}
.scrub{animation:scrub 1.1s ease-in-out infinite}
.wave{animation:waveArm 1s ease-in-out infinite}
.orate{animation:orate 2.6s ease-in-out infinite}
.raise{animation:raise 1.6s ease-in-out 1}
.flagw{transform-box:fill-box;transform-origin:0 100%;animation:flagw 1.2s ease-in-out infinite}
.glint{opacity:0;animation:glint 5s ease-in-out infinite}
.splash circle{opacity:0;animation:splash 1.1s ease-out infinite}
.cross{animation:cross var(--t,40s) linear infinite;animation-delay:var(--d,0s)}
.crossR{animation:crossR var(--t,40s) linear infinite;animation-delay:var(--d,0s)}
.patrol{animation:patrol 16s ease-in-out infinite alternate}
.run{animation:runBob .35s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.set{transition:opacity .2s}
.actor{animation:enter .8s ease-out both}
#sun{transition:cy 2s ease,cx 2s ease,fill 1s}

/* dialogue */
.dialog{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;align-items:start;background:linear-gradient(180deg,var(--panel),#18121f);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;user-select:none}
.dialog::before{content:"";position:absolute;left:14px;right:14px;top:-3px;height:5px;border-radius:3px;background:var(--trim)}
.portrait{width:112px;height:112px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:#2a2133;box-shadow:0 6px 22px #0008}
.portrait svg{width:100%;height:100%;display:block}
.portrait.talk .mouth{animation:talk .18s ease-in-out infinite}
.mouth{transform-box:fill-box;transform-origin:50% 50%}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.who{font-family:var(--f-display);font-size:21px;color:var(--gold);line-height:1.2}
.role{font-size:13px;color:var(--muted);margin-bottom:6px}
.text{font-size:17.5px;line-height:1.6;max-width:68ch;min-height:4.8em}
.text em{color:var(--gold);font-style:normal}
.more{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;animation:nudge 1.2s ease-in-out infinite}

/* choices */
.choices{display:grid;gap:10px}
.choices .ask{font-family:var(--f-display);font-size:19px;color:var(--parch)}
.choice{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;animation:rise .45s ease-out both}
.choice:hover:not([disabled]),.choice:focus-visible{border-color:var(--gold);background:var(--panel-2);transform:translateY(-2px);outline:none}
.choice .k{font-family:var(--f-display);font-size:22px;height:42px;display:grid;place-items:center;border-radius:9px;background:var(--gold);color:var(--night)}
.choice b{display:block;font-size:16.5px;font-weight:600}
.choice .d{display:block;color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.lock{color:var(--muted)}
.choice[disabled]{opacity:.5;cursor:not-allowed}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;overflow:hidden}
.ov>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:3;transition:height 1.1s ease}
.lb.t{top:0}.lb.b{bottom:0}
.ov.on .lb{height:11vh}
.cs-kicker{position:absolute;top:calc(11vh + 14px);left:16px;right:16px;text-align:center;z-index:4;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.85}
.cs-cap{position:absolute;left:16px;right:16px;bottom:calc(11vh + 56px);z-index:4;text-align:center;padding:14px 12px;background:radial-gradient(ellipse at center,#000b 0%,#0007 45%,transparent 72%);transition:opacity .8s,transform .8s}
.cs-cap.out{opacity:0;transform:translateY(8px)}
.cs-cap h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,44px);margin:0 auto;max-width:24ch;line-height:1.15;text-shadow:0 2px 24px #000,0 0 2px #000;text-wrap:balance}
.cs-cap p{margin:8px auto 0;max-width:60ch;font-size:clamp(14px,1.7vw,18px);font-style:italic;color:var(--parch);text-shadow:0 1px 12px #000}
.cs-btn{position:absolute;z-index:10;right:16px;bottom:calc(11vh + 14px);background:#000a;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:7px 16px;cursor:pointer;letter-spacing:.08em;font-size:13px}
.cs-btn:hover{background:var(--gold);color:var(--night)}
.card{position:relative;z-index:4;width:min(640px,100%);margin-inline:16px;background:linear-gradient(180deg,#221a2c,#140f1b);border:1px solid var(--line);border-radius:16px;padding:28px 24px 24px;box-shadow:0 30px 80px #000c;text-align:center;max-height:calc(100% - 32px);overflow:auto}
.card::before{content:"";position:absolute;left:18px;right:18px;top:-3px;height:6px;border-radius:3px;background:var(--trim)}
.card .ur{font-family:var(--f-urdu);font-size:22px;color:var(--gold);direction:rtl;line-height:2}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1.05;margin:4px 0 8px;color:var(--parch);text-wrap:balance}
.card p{color:var(--muted);margin:0 auto 14px;max-width:52ch}
.card label{display:block;text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.card input{width:100%;background:#0006;border:1px solid var(--line);color:var(--parch);border-radius:10px;padding:11px 12px;font:inherit;font-size:17px}
.card input:focus{border-color:var(--gold);outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.big{background:var(--gold);color:var(--night);border:0;border-radius:99px;padding:12px 26px;font-family:var(--f-display);font-size:19px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.big:hover{transform:translateY(-2px);box-shadow:0 8px 24px #e9b44c55}
.big.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left;margin-top:16px;font-size:13.5px;color:var(--muted)}
.howto div{background:#0004;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.howto b{display:block;font-weight:600}
.endstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.endstats div{background:#0005;border-radius:10px;padding:8px 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.endstats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--parch);letter-spacing:0}
.stagecard .num{font-family:var(--f-display);font-size:clamp(70px,14vw,150px);line-height:1;color:var(--gold);text-shadow:0 0 50px #e9b44c66}

/* keyframes */
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(1deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes sip{0%,62%,100%{transform:rotate(0)}72%,88%{transform:rotate(-125deg)}}
@keyframes scrub{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(-95deg)}}
@keyframes waveArm{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-120deg)}}
@keyframes orate{0%,100%{transform:rotate(-20deg)}40%{transform:rotate(-140deg)}60%{transform:rotate(-130deg)}}
@keyframes raise{0%{transform:rotate(0)}25%,70%{transform:rotate(-160deg)}100%{transform:rotate(0)}}
@keyframes flagw{0%,100%{transform:skewY(-6deg) scaleX(1)}50%{transform:skewY(6deg) scaleX(.85)}}
@keyframes glint{0%,78%,100%{opacity:0}86%{opacity:.85}}
@keyframes splash{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,8px),-22px);opacity:0}}
@keyframes cross{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes crossR{from{transform:translateX(1420px)}to{transform:translateX(-220px)}}
@keyframes patrol{from{transform:translateX(0)}to{transform:translateX(190px)}}
@keyframes runBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.25)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes rays{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes leafFall{0%{top:-5%;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:104%;opacity:0}}
@keyframes leafSpin{from{transform:translateX(-14px) rotate(-30deg)}to{transform:translateX(18px) rotate(220deg)}}
@keyframes rain{from{background-position:0 0}to{background-position:-30px 120px}}
@keyframes meetL{0%,15%{transform:translateX(0)}70%,100%{transform:translateX(98px)}}
@keyframes meetR{0%,15%{transform:translateX(0)}70%,100%{transform:translateX(-98px)}}
@keyframes heli{from{transform:rotate(-5deg) scale(1.08)}to{transform:rotate(4deg) scale(1.28)}}
@keyframes drive{from{transform:translateX(-700px)}to{transform:translateX(1500px)}}
@keyframes walkUp{0%{transform:translate(600px,640px) scale(2.6)}100%{transform:translate(600px,352px) scale(1.05)}}
@keyframes flash{0%,100%{opacity:0}4%{opacity:1}12%{opacity:0}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes lean{0%,70%{transform:rotate(0)}100%{transform:rotate(6deg)}}
@keyframes leanR{0%,70%{transform:rotate(0)}100%{transform:rotate(-6deg)}}

/* v2: atmosphere, walking, horses, gunfights */
.stage::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 95% at 50% 42%,transparent 58%,#000a 100%)}
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.loc-title{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:3;text-align:center;pointer-events:none;opacity:0;width:min(90%,640px)}
.loc-title.go{animation:locIn 4.4s ease both}
.loc-title small{display:block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 8px #000}
.loc-title span{display:block;font-family:var(--f-display);font-size:clamp(22px,3.6vw,40px);color:#fff;text-shadow:0 2px 18px #000,0 0 2px #000;line-height:1.1}
.sub{font-size:14.5px;color:var(--muted);font-style:italic;max-width:68ch;margin-top:4px}
.tribe{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tribe.enemy b{color:var(--khauf)}
.tribe.enemy .loy i{background:var(--khauf)}
.walk .leg{animation:legSwing .42s ease-in-out infinite alternate}
.walk .leg-r{animation-direction:alternate-reverse}
.walk .arm{animation:armSwing .42s ease-in-out infinite alternate!important}
.walk .arm.fr{animation-direction:alternate-reverse!important}
.actor-in{animation:walkIn 1.7s cubic-bezier(.3,.6,.4,1) both}
.speaking .arm.fr{animation:gesture 1.6s ease-in-out infinite}
.speaking>g>g{animation:speakBob .7s ease-in-out infinite}
.drift{animation:drift var(--t,120s) linear infinite;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:18 14;animation:flowDash 1.2s linear infinite}
.smoke circle{transform-box:fill-box;transform-origin:50% 50%;animation:smoke 4s ease-out infinite;opacity:0}
.fire{animation:fire .22s steps(2) infinite}
.peck{transform-box:fill-box;transform-origin:30% 90%;animation:peck 2.2s ease-in-out infinite}
.sweep{transform-box:fill-box;transform-origin:50% 0;animation:sweep 5s ease-in-out infinite alternate}
.rise-water{animation:riseW 10s ease-in-out both}
.typing-line{transform-box:fill-box;transform-origin:0 50%;animation:typeLine 1.6s steps(12) infinite}
.blinkdot{animation:twinkle 1.2s ease-in-out infinite}
.fly{animation:flyAway 6s ease-in 1s both}
.sceneA{animation:sceneOut 1s ease 4.6s both}
.sceneB{animation:sceneIn 1s ease 4.6s both}
.rainfall{animation:rainfall .35s linear infinite}
.lflash{animation:flash 5s 1.2s infinite;opacity:0}
.gallop .lg{animation:gallopLeg .48s ease-in-out infinite}
.gallop .lg2{animation-delay:-.1s}.gallop .lg3{animation-delay:-.24s}.gallop .lg4{animation-delay:-.34s}
.gallop .hb{animation:hbob .24s ease-in-out infinite alternate}
.trot .lg{animation:gallopLeg 1s ease-in-out infinite}.trot .lg2,.trot .lg3{animation-delay:-.5s}
.muzzle{opacity:0;transform-box:fill-box;transform-origin:0 50%;animation:muzzle var(--mt,.9s) steps(1) infinite;animation-delay:var(--md,0s)}
.tracer{stroke-dasharray:30 600;animation:tracer var(--mt,.9s) linear infinite;animation-delay:var(--md,0s)}
.spark{opacity:0;animation:spark var(--mt,1.1s) ease-out infinite;animation-delay:var(--md,0s)}
.shake{animation:shake .18s steps(2) infinite}
.zoomP{transform-box:fill-box;transform-origin:50% 50%;animation:zoomP 9s ease-out both}
@keyframes locIn{0%{opacity:0;transform:translate(-50%,10px)}14%,76%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes legSwing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes armSwing{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes walkIn{from{transform:translateX(var(--from,-300px))}to{transform:translateX(0)}}
@keyframes gesture{0%,100%{transform:rotate(0)}30%{transform:rotate(-62deg)}55%{transform:rotate(-36deg)}75%{transform:rotate(-52deg)}}
@keyframes speakBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1500px)}}
@keyframes flowDash{to{stroke-dashoffset:-64}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.45}100%{transform:translate(18px,-90px) scale(2.6);opacity:0}}
@keyframes fire{0%{opacity:1}50%{opacity:.55}}
@keyframes peck{0%,60%,100%{transform:rotate(0)}70%,80%{transform:rotate(38deg)}}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes riseW{from{transform:translateY(90px)}to{transform:translateY(0)}}
@keyframes typeLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flyAway{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(900px,-420px) rotate(-14deg) scale(.35)}}
@keyframes sceneOut{to{opacity:0;visibility:hidden}}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
@keyframes rainfall{from{transform:translate(0,-60px)}to{transform:translate(-14px,0)}}
@keyframes gallopLeg{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-38deg)}}
@keyframes hbob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes muzzle{0%{opacity:1}8%{opacity:.6}16%,100%{opacity:0}}
@keyframes tracer{from{stroke-dashoffset:30}to{stroke-dashoffset:-600}}
@keyframes spark{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes shake{0%{transform:translate(1.5px,-1px)}50%{transform:translate(-1.5px,1px)}}
@keyframes zoomP{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes sunUp{from{transform:translateY(150px)}}
@keyframes pan{from{transform:scale(1.2) translate(-40px,-20px)}to{transform:scale(1) translate(0,0)}}
@keyframes convoyIn{from{transform:translateX(-820px)}to{transform:translateX(0)}}
@keyframes rideIn{from{transform:translateX(-900px)}to{transform:translateX(1500px)}}
@keyframes dustPuff{0%{opacity:0;transform:scale(.4)}30%{opacity:.6}100%{opacity:0;transform:scale(2.2) translateX(-60px)}}


/* v3: estate screen, toasts, own-faisla box, film grain */
.hubcard{width:min(1000px,100%);text-align:left;padding:22px 20px}
.hubhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hubhead h2{font-size:clamp(26px,4vw,38px);margin:2px 0 0}
.hubtabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.htab{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:14px}
.htab.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
.hubbody h3{font-family:var(--f-display);font-weight:400;color:var(--gold);margin:18px 0 8px;font-size:20px}
.hint{color:var(--muted);font-size:13.5px;margin:10px 0;max-width:80ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpis div{background:#0005;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kpis small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpis b{font-family:var(--f-display);font-size:20px;font-weight:400;color:var(--parch);font-variant-numeric:tabular-nums}
.crops,.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.crop,.hire{background:#0004;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;min-width:0;align-content:start}
.crop span,.hire span{color:var(--muted);font-size:13px}
.hire.got{border-color:var(--gold)}
.cbar{height:6px;border-radius:3px;background:#0007;position:relative;overflow:hidden}.cbar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c)}
.ur{font-family:var(--f-urdu);font-style:normal;font-size:12px;color:var(--muted)}
.row3{display:flex;flex-wrap:wrap;gap:6px}
.hb{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--parch)}
.hb:hover:not([disabled]){border-color:var(--gold)}
.hb[disabled]{opacity:.45;cursor:not-allowed}
.hb.ghost{background:transparent}
.tbl{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(80px,.6fr) auto;gap:10px;align-items:center;background:#0004;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.trow span{display:block;color:var(--muted);font-size:12.5px}
.loyb{height:6px;background:#0007;border-radius:3px;position:relative}.loyb i{display:block;height:100%;background:var(--teal);border-radius:3px}
.loyb.rel i{background:var(--taluq)}.loyb em{position:absolute;right:0;top:-16px;font-size:11px;font-style:normal;color:var(--muted)}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.carcard{background:#0004;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:4px;font-size:13px;align-content:start}
.carcard svg{width:100%;height:auto;border-radius:8px;background:radial-gradient(ellipse at 50% 85%,#e9dcc0 0%,#8a7a6a 45%,#2a2230 100%)}.carcard span{color:var(--muted)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:80;background:#1f1828f2;border:1px solid var(--gold);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px #000a;max-width:calc(100% - 32px);animation:toastIn 4.2s ease both;pointer-events:none}
.toast b{display:block;color:var(--gold);font-family:var(--f-display);font-weight:400;font-size:17px}.toast span{font-size:13px;color:var(--parch)}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.custom{display:grid;gap:8px;background:var(--panel);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px}
.custom label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.custom .aistat{color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.custom textarea{width:100%;background:#0006;border:1px solid var(--line);color:var(--parch);border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical}
.custom textarea:focus{border-color:var(--gold);outline:none}
.big.sm{padding:8px 18px;font-size:16px;justify-self:start}
.grain{position:absolute;inset:-50%;z-index:3;pointer-events:none;opacity:.08;background-image:var(--grain);animation:grain .5s steps(4) infinite;mix-blend-mode:overlay}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.kb{transform-origin:600px 300px;animation:kb 16s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}

/* v3: living characters */
.tor,.hd,.fore,.mth,.eyesS{transform-box:view-box}
.tor{transform-origin:0 -40px}.eyesS{transform-origin:0 -73.8px}
.bob .tor,.act .tor{animation:breath 3.8s ease-in-out infinite;animation-delay:var(--dl,0s)}
.bob .hd,.act .hd{animation:headIdle 8s ease-in-out infinite;animation-delay:var(--dl,0s)}
.eyesS{animation:blinkS 5s infinite;animation-delay:var(--dl,0s)}
.speaking .hd{animation:nod 1.3s ease-in-out infinite!important}
.speaking .tor{animation:breath 1.5s ease-in-out infinite!important}
.speaking .arm.fr .fore{animation:foreGest 1.8s ease-in-out infinite}
.speaking .mth{animation:mouthTalk .22s steps(2) infinite}
.arm.sip .fore{animation:sipFore 5s ease-in-out infinite;animation-delay:inherit}
.arm.wave .fore{animation:waveFore .5s ease-in-out infinite alternate}
.arm.orate .fore{animation:orateFore 2.6s ease-in-out infinite}
.arm.scrub .fore{animation:scrubFore 1.1s ease-in-out infinite}
.walk .fore{transform:rotate(14deg)}
.walk .hd{animation:none!important}
.mth{fill:#5a2a22}
.phead{transform-origin:60px 100px;animation:pIdle 7s ease-in-out infinite}
.portrait.talk .brows{animation:browUp 1.4s ease-in-out infinite}
.portrait.talk .phead{animation:pTalk 1.6s ease-in-out infinite}
.brows{transform-box:fill-box;transform-origin:50% 50%}
@keyframes bob{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.6deg) translateY(-.5px)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.014,1.022)}}
@keyframes headIdle{0%,100%{transform:rotate(0)}18%,34%{transform:rotate(5deg)}52%,70%{transform:rotate(-4deg)}86%{transform:rotate(1deg)}}
@keyframes blinkS{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) translateY(.5px)}50%{transform:rotate(3deg)}75%{transform:rotate(-3deg) translateY(.4px)}}
@keyframes gesture{0%,100%{transform:rotate(-8deg)}30%{transform:rotate(-40deg)}55%{transform:rotate(-22deg)}75%{transform:rotate(-34deg)}}
@keyframes foreGest{0%,100%{transform:rotate(20deg)}30%{transform:rotate(100deg)}55%{transform:rotate(62deg)}75%{transform:rotate(88deg)}}
@keyframes mouthTalk{0%{transform:scaleY(1)}50%{transform:scaleY(2.8)}}
@keyframes sip{0%,62%,100%{transform:rotate(0)}72%,88%{transform:rotate(-50deg)}}
@keyframes sipFore{0%,62%,100%{transform:rotate(0)}72%,88%{transform:rotate(165deg)}}
@keyframes waveFore{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
@keyframes orateFore{0%,100%{transform:rotate(10deg)}40%{transform:rotate(-25deg)}60%{transform:rotate(-15deg)}}
@keyframes scrubFore{0%,100%{transform:rotate(40deg)}50%{transform:rotate(100deg)}}
@keyframes raise{0%{transform:rotate(0)}25%,70%{transform:rotate(-150deg)}100%{transform:rotate(0)}}
@keyframes pIdle{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(1.2deg) translateY(-.6px)}65%{transform:rotate(-1deg) translateY(.4px)}}
@keyframes pTalk{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg) translateY(.8px)}60%{transform:rotate(1.4deg)}}
@keyframes browUp{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-2px)}}

@media (max-width:720px){
  .hud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dialog{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px}
  .portrait{width:72px;height:72px}
  .text{font-size:16px}
  .howto,.endstats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Rise of the Numberdar</h1><span class="ur">نمبردار کا عروج</span></div>
    <div class="meta">
      <span class="pill">Stage <b id="m-stage">1</b> · <b id="m-stagename">The Village Dera</b></span>
      <span class="pill">Day <b id="m-day">1</b></span>
      <button class="pill btn-s" id="b-sound" type="button" aria-pressed="true">Sound on</button>
      <button class="pill btn-s" id="b-subs" type="button" aria-pressed="true">English subs on</button>
      <button class="pill btn-s" id="b-voice" type="button">Voices: Punjabi</button>
      <button class="pill btn-s" id="b-hub" type="button">Dera ⌂</button>
      <button class="pill btn-s" id="b-saves" type="button">Save / Load</button>
      <button class="pill btn-s" id="b-restart" type="button">New game</button>
    </div>
  </header>

  <section class="hud" aria-label="Your standing">
    <div class="stat" id="st-izzat" style="--c:var(--izzat)"><div class="lbl">Izzat · Respect <i>عزت</i></div><div class="val">0</div><div class="bar"><i></i></div></div>
    <div class="stat" id="st-khauf" style="--c:var(--khauf)"><div class="lbl">Khauf · Fear <i>خوف</i></div><div class="val">0</div><div class="bar"><i></i></div></div>
    <div class="stat" id="st-paisa" style="--c:var(--paisa)"><div class="lbl">Paisa · Wealth <i>پیسہ</i></div><div class="val">0</div><div class="bar"><i></i></div></div>
    <div class="stat" id="st-taluqat" style="--c:var(--taluq)"><div class="lbl">Ta'aluqat · Connections <i>تعلقات</i></div><div class="val">0</div><div class="bar"><i></i></div></div>
  </section>
  <div class="subhud"><span id="tribes"></span><span id="estate"></span><span>Rival <b>Malik Tori</b></span><span id="khauf-warn"></span></div>

  <div class="stage" id="stage">
    <svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid slice" id="scene" aria-label="Scene"></svg>
    <div class="rays" id="rays"></div>
    <div class="rain" id="rain"></div>
    <div class="leaves" id="leaves"></div>
    <div class="loc" id="loc">Chak 16 WB, Vehari</div>
    <div class="loc-title" id="loctitle"><small></small><span></span></div>
    <div class="fade" id="fade"></div>
  </div>

  <section class="dialog" id="dialog" tabindex="0" aria-live="polite">
    <div class="portrait" id="portrait"></div>
    <div style="min-width:0">
      <div class="eyebrow" id="eyebrow">Faisla</div>
      <div class="who" id="who">Narrator</div>
      <div class="role" id="role"></div>
      <div class="text" id="text"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="more" id="more">Click or press Space ▾</div>
  </section>

  <section class="choices" id="choices" aria-label="Your options"></section>
</div>

<div class="ov" id="cs" hidden>
  <svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" id="cs-svg"></svg>
  <canvas id="cs-fx"></canvas>
  <div class="lb t"></div><div class="lb b"></div>
  <div class="grain"></div>
  <div class="cs-kicker" id="cs-kicker"></div>
  <div class="cs-cap out" id="cs-cap"><h2></h2><p></p></div>
  <button class="cs-btn" id="cs-btn" type="button">Skip ▸</button>
</div>

<div class="ov" id="hub" hidden style="background:#0b0910ee;backdrop-filter:blur(3px)"><div class="card hubcard" id="hub-card"></div></div>

<div class="ov" id="menu" hidden style="background:#0b0910e6;backdrop-filter:blur(3px)">
  <div class="card" id="menu-card"></div>
</div>

<script>
/* ============ ART: people, portraits, vehicles, sets ============ */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SKIN=['#c68a5e','#b07a4f','#9a6844','#d39b6c','#a8734a','#8c5a3a'];
const CLOTH=['#e9e2d0','#cfc6ae','#a9b4a8','#8d9aa6','#c7a98a','#7d8c6e','#d8cfb8','#b9a27c','#9aa7b8'];
const DUP=['#b8476a','#d9822b','#4f7f9e','#8a4fa0','#c9a227','#2f8a6f','#a33b3b'];
const PARTY='#1d7a4c';

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);}
function person(o){
  const s=o.s||1,skin=o.skin||'#b07a4f',kam=o.kam||'#e9e2d0',sh=o.sh||kam,head=o.head||'none',hc=o.hc||'#f4f1e8',shoe=o.shoe||'#4a3322';
  const chad=head==='chador',top=chad?hc:kam,topD=shade(top,-.22),skD=shade(skin,-.18),hem=o.long?-6:-19,dl=(o.delay!=null?o.delay:R(0,4)).toFixed(2);
  let g=`<g class="p ${o.cls||''}" transform="translate(${o.x||0} ${o.y||0}) scale(${o.flip?-s:s} ${s})" style="--dl:${dl}s"><g class="${o.anim||''}${o.act?' act':''}" style="animation-delay:${dl}s">`;
  g+=`<ellipse cx="0" cy="1" rx="15" ry="3.2" fill="#000" opacity=".24"/>`;
  if(!o.seated){
    const leg=(side)=>{const m=side;return `<g class="leg${m>0?' leg-r':''}" style="transform-origin:${5*m}px -40px"><path d="M${11*m},-40 Q${14.5*m},-22 ${9.5*m},-5 L${3.5*m},-5 Q${1.5*m},-22 0,-40Z" fill="${m>0?shade(sh,-.12):sh}"/><path d="M${9.6*m},-6 Q${6.5*m},-4 ${3.4*m},-6" stroke="${shade(sh,-.3)}" stroke-width="1" fill="none"/><rect x="${m>0?3.2:-9.8}" y="-6" width="6.6" height="2.4" fill="${skin}"/><path d="M${m>0?2.4:-11.4},-.6 Q${m>0?2.4:-11.4},-4.2 ${m>0?6:-7.8},-4.2 L${m>0?9.6:-4.2},-4.2 Q${m>0?11.6:-2.4},-4.2 ${m>0?11.6:-2.4},-1.6 L${m>0?11.6:-2.4},.4 L${m>0?2.4:-11.4},.4Z" fill="${shoe}"/></g>`;};
    g+=leg(-1)+leg(1);
  }
  if(chad)g+=`<path d="M-10.5,-68 Q-12,-86 0,-86.5 Q12,-86 10.5,-68 L17.5,${hem+4} Q0,${hem+8} -17.5,${hem+4}Z" fill="${hc}"/><path d="M-6,-60 Q-9,-40 -11,${hem+6} M6,-60 Q9,-40 11,${hem+6}" stroke="${shade(hc,-.25)}" stroke-width="1" fill="none" opacity=".7"/>`;
  const arm=(m,cls,extra)=>`<g class="arm ${m>0?'fr ':''}${cls||''}" style="transform-origin:${13*m}px -56px;animation-delay:${o.adelay!=null?o.adelay:dl}s"><path d="M${10*m},-58 Q${16.5*m},-58.5 ${17.6*m},-50 L${18*m},-41 L${12.4*m},-40.5 L${11*m},-50Z" fill="${m>0?shade(top,-.06):topD}"/><g class="fore" style="transform-origin:${15*m}px -41px;animation-delay:inherit"><path d="M${12.4*m},-41.5 L${18*m},-41.5 L${17.8*m},-30 L${13*m},-30Z" fill="${m>0?shade(top,-.1):topD}"/><path d="M${12.8*m},-31 L${17.9*m},-31" stroke="${shade(top,-.35)}" stroke-width="1.6"/><ellipse cx="${15.4*m}" cy="-26.6" rx="2.7" ry="3.5" fill="${m>0?skin:skD}"/><path d="M${13.2*m},-28 q${-1.4*m},1.6 ${-.6*m},3.2" stroke="${skD}" stroke-width="1.1" fill="none"/>${extra||''}</g></g>`;
  let props='';
  if(o.cup)props+=`<path d="M12.4,-29.5 h6.6 l-1,6 h-4.6z" fill="#b5653a"/><path d="M12.4,-29.5 h6.6" stroke="#8a4a2a"/>`;
  if(o.kettle)props+=`<path d="M10,-27 q5.5,-7 11,0 v6.5 h-11z" fill="#262626"/><path d="M21,-24 l5,-4" stroke="#262626" stroke-width="2"/>`;
  if(o.mic)props+=`<rect x="13.6" y="-33" width="3.6" height="9" rx="1.6" fill="#1a1a1a"/><circle cx="15.4" cy="-33" r="2.6" fill="#555"/>`;
  if(o.rag)props+=`<rect x="11.5" y="-27" width="9" height="5" rx="1" fill="#e2d6b0"/>`;
  if(o.stick)props+=`<path d="M15.4,-26 L15.4,-82" stroke="#7a5230" stroke-width="2.6" stroke-linecap="round"/>`;
  if(o.gun)props+=`<path d="M12,-28 L44,-32" stroke="#1d1d1d" stroke-width="3.4" stroke-linecap="round"/><path d="M12,-28 L5,-24" stroke="#6a4424" stroke-width="5" stroke-linecap="round"/>`;
  if(o.flag)props+=`<g class="flagw" style="animation-delay:${o.adelay||0}s"><line x1="15.4" y1="-24" x2="15.4" y2="-56" stroke="#e8e0cc" stroke-width="1.1"/><path d="M15.4,-56 h13 v8.5 h-13z" fill="${o.flag}"/><path d="M15.4,-56 h3.5 v8.5 h-3.5z" fill="#fff"/></g>`;
  g+=arm(-1,o.barm);
  g+=`<g class="tor" style="animation-delay:${dl}s">`;
  g+=`<path d="M-12.5,-58.5 Q-15.5,-56.5 -15,-50 L-13.4,-42 Q-15.6,-30 -16.2,${hem} Q0,${hem+2.6} 16.2,${hem} Q15.6,-30 13.4,-42 L15,-50 Q15.5,-56.5 12.5,-58.5 Q0,-61.5 -12.5,-58.5Z" fill="${top}"/>`;
  g+=`<path d="M3,-60.5 Q12.5,-59.5 15,-50 L13.4,-42 Q15.6,-30 16.2,${hem} Q10,${hem+1.6} 6.5,${hem+1.4} Q9,-40 3,-60.5Z" fill="#000" opacity=".13"/><path d="M-11,-56.5 Q-13.4,-46 -12.2,-38 L-9.2,-38 Q-10,-48 -8,-57.5Z" fill="#fff" opacity=".09"/>`;
  g+=`<path d="M-6,-37 Q-7.4,-28 -5.4,${hem+1} M5.5,-35 Q6.6,-27 4.4,${hem+1} M-15.2,-29 L-13.8,${hem+.5} M15.2,-29 L13.8,${hem+.5}" stroke="#000" stroke-opacity=".14" stroke-width=".9" fill="none"/>`;
  if(!chad)g+=`<path d="M0,-60.5 L0,-44" stroke="#000" stroke-opacity=".22" stroke-width="1"/><path d="M-3.6,-61.2 Q0,-58.8 3.6,-61.2" stroke="${topD}" stroke-width="1.6" fill="none"/>${[-56,-52,-48].map(y=>`<circle cx="0" cy="${y}" r=".75" fill="${o.long?'#d8b04a':shade(top,-.4)}"/>`).join('')}`;

function villager(x,y,s,extra){
  const woman=Math.random()<.22;
  const o={x,y,s,skin:pick(SKIN),kam:pick(CLOTH),anim:'bob',delay:R(0,3)};
  if(woman){o.head='chador';o.hc=pick(DUP);}
  else{
    const h=Math.random();
    if(h<.35){o.head='turban';o.hc=pick(['#f4f1e8','#efe8d5','#e9d9a8'])}
    else if(h<.6){o.head='cap';o.hc=pick(['#f1ece0','#3a3a3a','#7a2a2a'])}
    else {o.head='hair';o.hc='#1b1512'}
    if(Math.random()<.5) o.beard=pick(['#1b1512','#e8e6e0','#c4541f','#6c6a66']);
    else if(Math.random()<.6) o.must='#1b1512';
  }
  return person(Object.assign(o,extra||{}));
}

const AMB={cv:null,ctx:null,mood:'dawn',set:'dera',P:[],birds:[],flash:0,t:0};
function ambInit(){
  const cv=document.createElement('canvas');cv.id='amb';$('#stage').insertBefore(cv,$('#rays'));AMB.cv=cv;AMB.ctx=cv.getContext('2d');
  const fit=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);};fit();addEventListener('resize',fit);
  for(let i=0;i<46;i++)AMB.P.push({x:Math.random(),y:Math.random(),vx:R(-.0004,.0004),vy:R(-.0003,.0001),r:R(.6,2.2),ph:R(0,6.28)});
  if(!reduced())requestAnimationFrame(ambLoop);
}
function ambMood(set,mood){AMB.set=set;AMB.mood=mood;}
function ambLoop(){
  requestAnimationFrame(ambLoop);if(document.hidden)return;
  const {cv,ctx}=AMB,W=cv.width,H=cv.height,d=devicePixelRatio||1,m=AMB.mood,s=AMB.set;AMB.t++;ctx.clearRect(0,0,W,H);
  const ff=(m==='night'||m==='dusk')&&(s==='dera'||s==='fields'),dust=['dawn','golden','noon'].includes(m)&&s!=='isb';
  if(ff||dust)for(const p of AMB.P){
    p.x+=p.vx+(ff?Math.sin(AMB.t/60+p.ph)*.0006:0);p.y+=p.vy+(ff?Math.cos(AMB.t/70+p.ph)*.0004:0);
    if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
    const a=ff?Math.max(0,Math.sin(AMB.t/25+p.ph))*.9:.22+.18*Math.sin(AMB.t/40+p.ph),X=p.x*W,Y=(ff?.45+p.y*.55:p.y)*H;
    ctx.fillStyle=ff?`rgba(210,255,120,${a})`:`rgba(255,236,190,${a})`;ctx.beginPath();ctx.arc(X,Y,p.r*d*(ff?1.3:1),0,6.28);ctx.fill();
    if(ff&&a>.5){ctx.fillStyle=`rgba(210,255,120,${a*.15})`;ctx.beginPath();ctx.arc(X,Y,p.r*d*6,0,6.28);ctx.fill();}
  }
  if(['dawn','golden','noon','dusk'].includes(m)&&s!=='isb'){
    if(!AMB.birds.length&&Math.random()<.005){const dir=Math.random()<.5?1:-1,y=R(.06,.26),n=4+Math.floor(R(0,5));for(let i=0;i<n;i++)AMB.birds.push({x:dir>0?-.05-i*.03:1.05+i*.03,y:y+(i%2?1:-1)*i*.008,v:.0016*dir*R(.9,1.1),ph:R(0,6)});}
    ctx.strokeStyle=m==='noon'?'rgba(40,40,50,.8)':'rgba(30,20,30,.85)';ctx.lineWidth=1.6*d;
    for(const b of AMB.birds){b.x+=b.v;const w=Math.sin(AMB.t/5+b.ph)*4*d,X=b.x*W,Y=b.y*H;ctx.beginPath();ctx.moveTo(X-7*d,Y-w);ctx.quadraticCurveTo(X-3*d,Y-2*d,X,Y);ctx.quadraticCurveTo(X+3*d,Y-2*d,X+7*d,Y-w);ctx.stroke();}
    AMB.birds=AMB.birds.filter(b=>b.x>-.4&&b.x<1.4);
  }else AMB.birds=[];
  if(m==='storm'&&AMB.flash<=0&&Math.random()<.004){AMB.flash=1;if(live())thunder(now()+R(.2,.8));}
  if(AMB.flash>0){ctx.fillStyle=`rgba(230,240,255,${AMB.flash*.55})`;ctx.fillRect(0,0,W,H);AMB.flash-=.06;}
}

    if(lastWho!==l.who){pt.innerHTML=portrait(c);lastWho=l.who;}
    $('#who').textContent=c.name;$('#role').textContent=c.role;

function electionScore(s){const f=s.flags;return s.izzat+s.taluqat*.5+(f.ticket?12:0)+(s.jatt+s.arain+s.rajput+s.joiya+s.kamboh-250)/8+(f.app?6:0)+(f.social?5:0)+(f.germany?8:0)+(f.danishHome?4:0)+(f.solar?4:0)+(f.pact?4:0)+(f.hero?5:0)+(f.peace?8:0)-(f.rigged?12:0)-(s.khauf>70?10:0)+Math.min(8,(s.cars||[]).length)+Math.min(6,Math.max(0,((s.acres||52)-52)/10));}
function presScore(s){const f=s.flags;return s.izzat+s.taluqat+(f.bloc?10:0)+(f.minister?8:0)+(f.germany?5:0)+(f.app?5:0)-(s.khauf>70?15:0);}

water:{title:`Faisla · The Stolen Water`,set:'dera',mood:'dawn',cam:'wide',cut:'intro',loc:`Chak 16 WB, Vehari · Dera courtyard · 7:12 AM`,
  cast:{rasool:'L1',asif:'L2',ditta:'R1',yaqoob:'R2',zainab:'R3'},
  lines:[
    ['nar',`Fajr has passed. Sixty villagers wait under the banyan tree, sipping doodh-patti from clay cups. Gul Khan polishes the Land Cruiser's mirror for the third time. At the gate, Sher Muhammad sorts every face into ours and not ours.`],
    ['nar',`You step onto the veranda in starched white, a charcoal waistcoat and Peshawari chappals. The courtyard falls silent row by row. "Numberdar Sahib aa gaye."`],
    ['rafiq',`Numberdar Sahib, aj masla bhaari ae. Ghulam Rasool te Allah Ditte de bande aaye ne. Nehri paani da rola ae. Thora khoon vi dul gaya ae... hale tak.`,`Sahib, a heavy matter today. Ghulam Rasool's people and Allah Ditta's people. Canal water. A little blood has been spilled. So far.`],
    ['rasool',`Kal raat saadi wari si mogay te! Allah Ditte de puttraan ne raat do vajay saada bannaa torh ditta, te mere Asif nu dang maarya. Main parcha karaana ae! Ehnaan nu thaane bhejo!`,`Last night was OUR turn at the outlet! Allah Ditta's sons broke our embankment at 2 AM and hit my Asif with an iron staff. I want an FIR. Send them to the police station!`],
    ['asif',`Numberdar Sahib, tusi bas ik vaari keh deo, main aape nibed lainaan.`,`Just say the word once, Numberdar Sahib, and I'll settle it myself.`],
    ['ditta',`Allah gawah ae, Sahib. Tinn saal ton Chaudhry vadh paani lainda pya ae. Ohne SDO nu paise de ke wari badalwa layi. Meri kanak sukk rahi ae.`,`Allah is my witness, Sahib. For three years the Chaudhry has taken extra water. He paid the irrigation SDO to change the schedule. My wheat is drying up.`],
    ['zainab',`Sahib, eh 1998 di warabandi ae. Saadi wari lammi ae. Likhya hoya ae.`,`Sahib, this is the 1998 water schedule. Our turn is the longer one. It is written down.`],
    ['rafiq',`Sahib, Jattaan de ethay 2,200 vote ne, Araeenaan de 1,400. Ghulam Rasool, Malik Tori da yaar ae. Te SHO Tariq Bhatti udeek reha ae ke tusi kidhar ho, phir parcha likhe ga.`,`Sahib, the Jatts have 2,200 votes here, the Arains 1,400. Ghulam Rasool is Malik Tori's friend. And SHO Tariq Bhatti is waiting to see whose side you take before he writes any FIR.`]],
  choices:[
    {l:`The law of the document`,d:`Restore Allah Ditta's turn by the 1998 schedule. His sons pay daand to Asif for the wound.`,fx:{izzat:8,arain:20,jatt:-15},
     r:[['rasool',`Achha, eh ae Numberdar da insaaf? Ik kaagaz, Jatt de khoon ton bhaari ho gaya?`,`So this is the Numberdar's justice? A piece of paper outweighs a Jatt's blood?`],['ditta',`Allah tuhada Dera sada bharya rakhe, Sahib.`,`May Allah keep your Dera full forever, Sahib.`],['rafiq',`Sahib... Ghulam Rasool di gaddi Malik Tori de pind val mur gayi ae.`,`Sahib... Ghulam Rasool's car just turned toward Malik Tori's village.`]]},
    {l:`The generous patron`,d:`Pay Rs 15 lakh from your own pocket for a new tubewell on Allah Ditta's land, then ask both elders to embrace.`,fx:{paisa:-.15,izzat:15,jatt:8,arain:12},cut:'faisla',
     r:[['rasool',`Tubewell? Phir te larn layi paani hi nahin bachya.`,`A tubewell? Then there's no water left to fight over.`],['ditta',`Yaaraan saal, Ghulam Rasool. Yaaraan saal asaan ikathe hukka nahin peeta.`,`Eleven years, Ghulam Rasool. Eleven years we haven't shared a hookah.`]]},

  lines:[
    ['nar',`A police mobile rolls through the gate, siren off, lights on. Inspector Tariq Bhatti steps out, adjusts his cap, and accepts a glass of lassi before he says a word.`],
    ['sho',`Numberdar Sahib, ik nikki jehi gal ae. Kala Dogar, dangar chor, Mailsi wich tinn parchay. Mera mukhbar kehnda ae oh tuhade canal road waale tubewell te sutta pya ae.`,`Numberdar Sahib, a small matter. Kala Dogar, cattle thief, three FIRs in Mailsi. My informer says he's sleeping at your tubewell on the canal road.`],
    ['rafiq',`Sahib, Kala Dogar, Haji Bashir da bhateeja ae. Haji Bashir ne tuhade marhoom abba nu 300 vote ditte san.`,`Sahib, Kala Dogar is Haji Bashir's nephew. Haji Bashir brought 300 votes to your late father.`],
    ['sho',`DPO sahib sir te charhe hoye ne. Ya main ohnu lai jaanwaan, ya koi navi mobile de tyraan da kharcha de deve te main likh dewaan ke mukhbar ghalat si. Marzi tuhadi.`,`The DPO is on my back. Either I take him, or someone pays for the new mobile's tyres and I write that the informer was wrong. Your choice.`]],

    {l:`Ride Sultan yourself`,d:`Take the lance and ride in the neza bazi in front of the whole district.`,fx:{izzat:14,rajput:15,khauf:4},cut:'neza',
     r:[['rana',`Shabaash! Ajj ton Rajput biradari tuhadi ae, Numberdar Sahib.`,`Bravo! From today the Rajput biradari is yours, Numberdar Sahib.`],['nar',`Malik Tori's mare misses the peg. He leaves the mela before the prize-giving.`]]},
    {l:`Sponsor the prizes`,d:`Rs 25 lakh for a motorcycle, a buffalo and gold medals for the winners.`,fx:{paisa:-.25,izzat:6,rajput:10},
     r:[['rana',`Bari meharbani. Par lok kehnde ne, asal sardar ghore te baithda ae.`,`Many thanks. But people say a real chief sits on a horse.`]]},
    {l:`Bet against Malik Tori`,d:`Put Rs 50 lakh on a Rajput rider against Malik Tori's mare. Double or nothing.`,fx:s=>{const w=s.rajput>=60||s.izzat>=60;s.flags.betWon=w;return w?{paisa:.5,izzat:4,rajput:6}:{paisa:-.5,izzat:-4};},
     r:[{who:'nar',t:`The Rajput rider lifts the peg cleanly. Malik Tori pays up in front of everyone.`,when:s=>s.flags.betWon},{who:'nar',t:`Malik Tori's mare takes the peg. He counts your money slowly, in front of everyone.`,when:s=>!s.flags.betWon}]}],
  next:'rumor'},

rumor:{title:`Whispers in the Biradari`,set:'dera',mood:'dusk',cam:'faisla',loc:`Dera courtyard · Maghrib`,cast:{rafiq:'L1',sherm:'R1'},
  lines:[
    ['nar',`Maghrib. The lanterns on the gate are lit. A cold wind moves through the banyan leaves.`],
    ['sherm',`Sahib. Malik Tori de bande kal raat Jattaan di chaupal te san. Keh rahe san ke tusi nehri paani shugar mill nu vech ke paise apni jeb wich paa laye.`,`Sahib. Malik Tori's men were at the Jatt chaupal last night. They're saying you sold canal water to the sugar mill and pocketed the money.`],
    ['rafiq',`Jhooth ae, par bari tezi naal phail reha ae. Tinn gharaan ne tuhada poster laah ditta ae.`,`It's a lie, but it's spreading fast. Three families have already taken down your poster.`],
    ['sherm',`Mainu chhe bande te do Vigo deo. Subah tak us chaupal wich kise nu eh gal yaad nahin rahegi.`,`Give me six men and two Vigos. By morning nobody in that chaupal will remember the rumour.`]],
  choices:[
    {l:`Hold a jalsa in the chowk`,d:`Bring the mill records, the canal schedule and a sound system. Answer the lie in public.`,fx:{paisa:-.5,izzat:12,jatt:8},
     r:[['nar',`Two thousand people. You read the sugar mill's payment ledger aloud, line by line. By the end, the Jatt elders are nodding.`]]},
    {l:`Send Sher Muhammad`,d:`The Vigos roll out at midnight. No blood. Just a message.`,fx:{khauf:20,izzat:-6,jatt:-4,joiya:-4},
     r:[['nar',`Headlights sweep the Jatt chaupal at 2 AM. Doors stay shut. By sunrise the rumour has stopped. So has the chatter in your own courtyard.`]]},
    {l:`Invite Malik Tori to dinner`,d:`Seat your rival at your own dastarkhwan, in front of the whole village.`,fx:{izzat:6,taluqat:8,khauf:-5,joiya:4},
     r:[['afzal',`Numberdar, tuhadi biryani tuhadi siyasat ton changi ae.`,`Numberdar, your biryani is better than your politics.`],['nar',`He laughs. He eats. With two hundred witnesses watching, the rumour has nowhere left to stand.`]]}],
  next:'friend_it'},

friend_it:{title:`Eid, and an Old Friend`,set:'dera',mood:'golden',cam:'faisla',loc:`Dera courtyard · Eid-ul-Fitr`,cast:{hamza:'L1',rafiq:'R1'},
  lines:[
    ['nar',`Eid-ul-Fitr. The Dera smells of sheer khurma and new clothes. A Corolla with Lahore number plates stops at the gate.`],
    ['hamza',`Oye Numberdar! Yaad ae Government Primary School wich tera hisaab da kaam kaun nakal karda si? Hun main software banaunda haan. Lahore, Arfa Tower, team lead.`,`Hey Numberdar! Remember who copied your maths homework at the Government Primary School? Now I write software. Lahore, Arfa Tower, team lead.`],
    ['hamza',`Main soch reha si. Tera adha din gum hoyiyaan shikayataan wich langh janda ae: nehri wari, zameen da record, police. Mainu do mahine de, main Dere layi app bana dewaan ga. Har case da number hovega.`,`I've been thinking. Half your day goes on complaints that get lost: canal turns, land records, police. Give me two months and I'll build the Dera an app. Every case gets a number.`],
    ['rafiq',`Sahib, app? Adha pind hale vi Nokia chalaanda ae.`,`Sahib, an app? Half the village still uses Nokia phones.`],
    ['hamza',`Baaki adhe kol WhatsApp ae, Master ji. Shuru karan layi kaafi ae.`,`The other half has WhatsApp, Master ji. That's enough to start.`]],
  choices:[
    {l:`Build the Dera Helpline`,d:`Fund Hamza's team: Rs 40 lakh for a complaint and faisla tracking app with a WhatsApp line.`,fx:{paisa:-.4,izzat:10,taluqat:6},flag:'app',cut:'it',
     r:[['hamza',`Do mahine. Te pehli shikayat nehri paani di honi chahidi ae.`,`Two months. And the first complaint has to be about canal water.`]]},
    {l:`Run my social media`,d:`Ask Hamza to run your Facebook and TikTok for the coming elections.`,fx:{izzat:6,taluqat:4,paisa:-.15},flag:'social',
     r:[['hamza',`Tere jalse de clip Vehari de har phone te honge. Bas gaana main chunaanga.`,`Your jalsa clips will be on every phone in Vehari. I'm just choosing the music.`]]},
    {l:`Just enjoy Eid`,d:`Politics can wait. Spend the day eating and playing cards like old times.`,fx:{izzat:4,khauf:-3},
     r:[['nar',`You lose four games of rung and laugh more than you have in a year. Hamza drives back to Lahore with a degh of biryani in the boot.`]]}],
  next:'flood'},

flood:{title:`The Monsoon Breaks`,set:'dera',mood:'storm',cam:'crowd',cut:'flood',loc:`Chak 16 WB · Third day of rain`,cast:{rafiq:'L1',zainab:'R1'},
  lines:[
    ['rafiq',`Sahib, chaar sau ghar. Te tuhadi kamad waala bannaa vi kamzor ae. Saade kol bande te tractor ik jagah layi ne, dowaan layi nahin.`,`Sahib, four hundred families. And the embankment by your sugarcane is weak too. We have men and tractors for one place, not both.`],
    ['zainab',`Numberdar Sahib, basti de school di chhat dig gayi ae. Bachay masjid di chhat te ne.`,`Numberdar Sahib, the basti school roof has collapsed. The children are on the mosque roof.`]],
  choices:[
    {l:`Open the Dera`,d:`Turn the Dera into a relief camp. Tractors to the basti, deghs of daal on the fire, all from your own pocket.`,fx:{paisa:-1,izzat:18,arain:10,jatt:5,kamboh:5},
     r:[['nar',`By night, 1,100 people sleep under your banyan tree. Gul Khan drives the Land Cruiser through floodwater with nine children in the back.`]]},
    {l:`Call in Islamabad`,d:`Ring the sitting MNA and the Deputy Commissioner. Get army boats and relief funds here, with your name on the banner.`,fx:{taluqat:12,izzat:6},req:s=>s.taluqat>=25||s.rel.dc>=50,rt:`Ta'aluqat 25 or DC relation 50`,
     r:[['nar',`At dawn, two army boats arrive. The relief banners read: "Courtesy of Numberdar Sahib."`]]},
    {l:`Save your fields`,d:`The cane pays for the Dera. Hold your embankment. The basti can wait for the government.`,fx:{paisa:.6,izzat:-14,khauf:6,arain:-12},
     r:[['nar',`Your cane survives. A photo of children huddled on the mosque roof under plastic sheets is shared 40,000 times.`]]}],
  next:'feud'},

feud:{title:`Dushmani on the Canal Road`,set:'dera',mood:'night',cam:'faisla',cut:'ambush',loc:`Dera courtyard · After midnight`,cast:{sherm:'L1',siraj:'R1'},
  lines:[
    ['nar',`Back at the Dera, a doctor stitches the guard's arm by lantern light. The Land Cruiser has eleven bullet holes.`],
    ['sherm',`Sahib, eh Mureed Joiya de bande san. Main aawaz pehchaan layi. Malik Tori ne ehnaan nu bheja si.`,`Sahib, those were Mureed Joiya's men. I recognised the voices. Malik Tori sent them.`],
    ['siraj',`Numberdar Sahib, tees saal ton Joiya saade naal dushmani rakhde ne. Saade tinn puttar is dushmani wich gaye. Hun tuhade te vi goli chal gayi. Hun ki karna ae?`,`Numberdar Sahib, the Joiyas have kept a blood feud with us for thirty years. We lost three sons to it. Now they've fired on you too. What now?`],
    ['rafiq',`Sahib, je asi badla laiye te eh dushmani agle tees saal chale gi. Te je chup rahiye, lok kehnge Numberdar dar gaya.`,`Sahib, if we take revenge this feud will run another thirty years. If we stay quiet, people will say the Numberdar got scared.`]],
  choices:[
    {l:`Strike back tonight`,d:`Sher Muhammad takes twenty men and the Vigos to the Joiya settlement before dawn.`,fx:{khauf:20,izzat:-4,joiya:-15,kamboh:10,taluqat:-6},
     r:[['nar',`Shots echo across the cane fields until Fajr. Nobody is killed, but by morning every Joiya gate has a bullet mark. The police register cases against both sides.`]]},
    {l:`File the FIR and go to court`,d:`Name Mureed Joiya's men in an FIR, push the DPO for arrests, and let the law work.`,fx:{taluqat:8,izzat:6,joiya:-6},
     r:[['nar',`Four of Mureed Joiya's men are arrested within a week. Malik Tori pays for their lawyers.`]]},
    {l:`Call a jirga of all five biradaris`,d:`Invite the elders of the Jatts, Arains, Rajputs, Joiyas and Kambohs to end the dushmani at your Dera.`,req:s=>s.izzat>=60,rt:`Izzat 60`,fx:{izzat:16,khauf:-8,joiya:22,kamboh:12,jatt:5,arain:5,rajput:5},flag:'peace',cut:'peace',
     r:[['mureed',`Numberdar, asi Malik Tori di jang lard rahe saan, apni nahin. Ajj ton eh dushmani khatam.`,`Numberdar, we were fighting Malik Tori's war, not our own. From today this feud is over.`],['siraj',`Allah tuhanu lammi umar deve.`,`May Allah give you a long life.`]]}],
  next:'politician'},

politician:{title:`A Guest from Lahore`,set:'dera',mood:'golden',cam:'faisla',loc:`Dera courtyard · Golden hour`,cast:{begum:'L1',rafiq:'R1'},
  lines:[
    ['nar',`A line of white Land Cruisers kicks up dust on the canal road. Dhol players start up at the gate. Begum Shahnaz Durrani, chairperson of the Pakistan Awami Ittehad, steps out in a cream dupatta.`],
    ['begum',`Numberdar Sahib, Vehari ton Lahore tak lok ikko gal karde ne: is seat da raasta tuhade Dere ton langhda ae.`,`Numberdar Sahib, from Vehari to Lahore people say one thing: the road to this seat runs through your Dera.`],
    ['begum',`Party nu ethay jittan waala banda chahida ae. Ticket tuhada ho sakda ae. Party de kharche vi ne. Do crore party fund wich, te tuhadi biradari di poori himayat.`,`The party needs a winner here. The ticket can be yours. The party has expenses too. Two crore to the party fund, and your biradari's full support.`],
    ['rafiq',`Sahib, ticket ton baghair asi Malik Tori te party machine dowaan naal larange.`,`Sahib, without a ticket we fight Malik Tori and the party machine at the same time.`]],
  choices:[
    {l:`Pay for the ticket`,d:`Rs 2 crore to the party fund. The PAI machine is yours.`,fx:{paisa:-2,taluqat:20},flag:'ticket',
     r:[['begum',`PAI family wich khush aamdeed. Jumme tak notification aa jaaye ga.`,`Welcome to the PAI family. The notification will be out by Friday.`]]},
    {l:`Offer votes, not cash`,d:`Promise 40,000 biradari votes across three constituencies. Not one rupee.`,fx:{taluqat:15,izzat:5},flag:'ticket',req:s=>s.izzat>=55,rt:`Izzat 55`,
     r:[['begum',`Numberdar jehra paise di thaan vote naal saudaa karda ae. Theek ae. Ticket tuhada.`,`A Numberdar who bargains with votes instead of cash. Fine. The ticket is yours.`]]},
    {l:`Run independent`,d:`Thank her, refuse, and tell the village you belong to no one but them.`,fx:{izzat:12,taluqat:-8},
     r:[['begum',`Azad umeedwar aksar jittan ton baad saade kol aaonde ne, Numberdar Sahib. Asi udeekange.`,`Independents usually come to us after they win, Numberdar Sahib. We'll be waiting.`]]}],
  next:'jalsa'},

/* ---- Stage 2: The MNA Campaign ---- */
jalsa:{stage:2,title:`The First Jalsa`,set:'jalsa',mood:'dusk',cam:'stage',loc:`Stadium ground, Vehari · 40 days to polling`,
  lines:[
    ['nar',`The stage is up: twelve speaker stacks, light rigs, and a banner of your face eighteen feet tall. Your election symbol is the tubewell.`],
    ['rafiq',`Sahib, ik masla ae. Malik Tori ne apne jalse layi 70 busaan kiraye te laiyaan ne, isse waqt nehar de us paar. Saadiyaan adhiyaan kursiyaan khaali ne.`,`Sahib, a problem. Malik Tori has hired 70 buses for his own jalsa across the canal at the same hour. Half our chairs are empty.`]],
  ask:`How do you fill the ground?`,
  choices:[
    {l:`Buses and biryani`,d:`Rs 1.5 crore for ninety buses and a degh of biryani for every union council.`,fx:{paisa:-1.5,izzat:10,jatt:5},
     r:[['nar',`By 9 PM the ground is packed. Half the crowd is still eating when you take the microphone.`]]},
    {l:`Speak about water`,d:`Forget the chairs. Talk about the 1998 warabandi, the bribed SDO, and a tubewell for every village.`,fx:{izzat:14,arain:10},cut:'rally',
     r:[['nar',`Someone live-streams it. By midnight the clip has 300,000 views, and the empty chairs are not in it.`]]},
    {l:`Bring a star singer`,d:`Rs 80 lakh for a famous Punjabi folk singer. They come for the music and stay for you.`,fx:{paisa:-.8,izzat:8,khauf:-3},
     r:[['nar',`The dhol runs until 2 AM. Old men dance in their chadors. Between songs, the crowd chants your name.`]]}],
  next:'germany'},

germany:{title:`A Call from Germany`,set:'fields',mood:'dusk',cam:'wide',cut:'germany',loc:`The canal bank · Maghrib`,cast:{rafiq:'R1'},
  lines:[
    ['nar',`Dusk by the canal. Your phone buzzes: a video call from Frankfurt. Danish, your friend since your kabaddi days, is wrapped in a winter jacket with snow behind him.`],
    ['danish',`Guten Abend, Numberdar Sahib! Haan, hun main German bolda haan. Panj saal raat diyaan shiftaan te grammar diyaan classaan, banda sab kuj sikh janda ae.`,`Good evening, Numberdar Sahib! Yes, I speak German now. Five years of night shifts and grammar classes teach you everything.`],
    ['danish',`Sun. Germany wich Vehari te Multan de tinn sau bande ne. Ohnaan ne tera paani waala bhashan vekhya. Oh madad karna chaunde ne.`,`Listen. There are three hundred people from Vehari and Multan in Germany. They watched your water speech. They want to help.`],
    ['danish',`Asi campaign layi paise bhej sakde haan. Ya main chhuti lai ke wapas aa jaanwaan te tere naal pind pind phiraan. Ya dowein, je tu pyaar naal kahein.`,`We can send money for the campaign. Or I take leave, fly home and go village to village with you. Or both, if you ask nicely.`],
    ['rafiq',`Sahib, bahar gaye munde de har union council wich rishtedaar ne. Jadon Germany ton phone aaonda ae, saara ghar sunda ae.`,`Sahib, boys working abroad have relatives in every union council. When a call comes from Germany, the whole house listens.`]],
  choices:[
    {l:`Accept the overseas fund`,d:`Danish's network sends Rs 1.2 crore, legally, through the bank.`,fx:{paisa:1.2,taluqat:6},flag:'germany',
     r:[['danish',`Somvaar nu transfer ho jaayegi. Har euro di bank raseed. Tere mukhaalif zaroor check karange.`,`The transfer goes on Monday. A bank receipt for every euro. Your opponents will definitely check.`]]},
    {l:`Bring Danish home`,d:`Ask him to fly back and lead the campaign in the villages.`,fx:{izzat:12,jatt:5,arain:5,kamboh:5},flag:['germany','danishHome'],
     r:[['danish',`Jummeraat nu Lahore airport. Gul Khan nu bhejin, Land Cruiser nahin. Main aam bande wangoon aana chaunda haan.`,`Thursday, Lahore airport. Send Gul Khan, not the Land Cruiser. I want to arrive like an ordinary person.`]]},
    {l:`German solar tubewells`,d:`Ask him to bring a German solar engineering partner to put solar pumps on 50 tubewells.`,fx:{izzat:10,taluqat:10,paisa:-.5},flag:['germany','solar'],req:s=>s.taluqat>=30,rt:`Ta'aluqat 30`,
     r:[['danish',`Solar pump, German engineer, Pakistani frame. Kisaan da diesel bachega, te har pump te tera naa.`,`Solar pumps, German engineers, Pakistani frames. Farmers save on diesel, and your name is on every pump.`]]}],
  next:'media'},

media:{title:`Breaking News`,set:'dera',mood:'noon',cam:'faisla',loc:`Dera courtyard · 26 days to polling`,cast:{saima:'L1',rafiq:'R1'},
  lines:[
    ['nar',`A white Suzuki with a channel logo stops at the gate. Saima Qureshi, the most-watched crime reporter in Punjab, walks in with a cameraman.`],
    {who:'saima',t:`Mere kol ik video ae, Numberdar Sahib. Tuhadiyaan Vigo, Jattaan di chaupal, raat de do vaje. Nau vaje chalan ton pehlaan kuj kehna chaunde o?`,en:`I have a video, Numberdar Sahib. Your Vigos at the Jatt chaupal, 2 AM. Anything to say before it airs at nine?`,when:s=>s.khauf>=45},
    {who:'saima',t:`Mere kol kaagaz ne ke 2009 wich tuhade khaandaan de zameen record badle gaye san. Nau vaje chalan ton pehlaan kuj kehna chaunde o?`,en:`I have documents saying your family's land records were altered in 2009. Anything to say before it airs at nine?`,when:s=>s.khauf<45}],
  choices:[
    {l:`Sit for a full interview`,d:`Answer every question on camera. No edits, no conditions.`,fx:{izzat:10,khauf:-6},
     r:[['saima',`Main chaali siyasatdaanaan da interview kitta ae. Tusi pehle o jinhaan camera band karan nu nahin kiha.`,`I've interviewed forty politicians. You're the first who didn't ask me to switch the camera off.`]]},
    {l:`Buy the bulletin`,d:`Rs 1 crore of "advertising" for the channel. The story disappears.`,fx:{paisa:-1,taluqat:6,izzat:-5},
     r:[['nar',`At nine, the channel runs a cooking segment. Saima Qureshi posts one line: "Some stories are expensive."`]]},
    {l:`Make a call`,d:`Have a friend in the ministry ask about the channel's licence renewal.`,fx:{khauf:12,taluqat:4,izzat:-4},req:s=>s.taluqat>=40||s.rel.media>=55,rt:`Ta'aluqat 40 or Press club 55`,
     r:[['nar',`The story is pulled. Saima is moved to the weather desk. Every reporter in the district now has your number saved.`]]},
    {l:`Show her the Helpline records`,d:`Every land record and complaint since launch is logged in Hamza's app. Give her full access.`,fx:{izzat:12,khauf:-4},req:s=>s.flags.app,rt:`the Dera Helpline`,
     r:[['saima',`Baaran hazaar case, taareekhaan samet. Eh story te hun tuhade haq wich ban gayi ae.`,`Twelve thousand cases, with dates. This story is now in your favour.`]]}],
  next:'dacoits'},

dacoits:{title:`Dacoits in the Kacha`,set:'fields',mood:'dawn',cam:'wide',loc:`The river belt · Before dawn`,cast:{siraj:'L1',sherm:'R1'},
  lines:[
    ['nar',`Before dawn, a rider gallops up to the Dera. Dacoits from the river belt hit a Kamboh basti in the night.`],
    ['siraj',`Numberdar Sahib! Daakuaan ne mere bhateeje de das dangar khol laye, te ohde puttar nu vi chukk ke lai gaye. Darya wal nasse ne.`,`Numberdar Sahib! Dacoits took ten of my nephew's cattle and kidnapped his son. They've run toward the river.`],
    ['sherm',`Sahib, police nu pahunchan wich chaar ghante lagne ne. Ghore taiyaar ne. Kacha wich gaddi nahin jaandi.`,`Sahib, the police need four hours to get here. The horses are ready. No car can drive into the kacha.`]],
  choices:[
    {l:`Ride after them on Sultan`,d:`Lead twelve riders into the kacha yourself.`,fx:{izzat:16,khauf:8,kamboh:15},flag:'hero',cut:'chase',
     r:[['siraj',`Allah tuhanu sada salaamat rakhe. Kamboh biradari eh ehsaan kade nahin bhulle gi.`,`May Allah always keep you safe. The Kamboh biradari will never forget this.`],['nar',`By noon the boy is home and the cattle are back in their pens. The story spreads faster than any jalsa.`]]},
    {l:`Send the police with your vehicles`,d:`Lend the police your Vigos and drivers and let them handle it.`,fx:{taluqat:10,izzat:4,kamboh:5},
     r:[['nar',`The police recover the cattle by evening. The boy is released two days later.`]]},
    {l:`Pay the ransom quietly`,d:`Rs 40 lakh through a middleman. Nobody gets hurt.`,fx:{paisa:-.4,izzat:3,kamboh:6},
     r:[['siraj',`Munda te ghar aa gaya, Numberdar Sahib. Par daaku hun jaande ne ke paisa kitthon milda ae.`,`The boy is home, Numberdar Sahib. But now the dacoits know where the money comes from.`]]}],
  next:'faceoff'},

faceoff:{title:`Face-off on the Canal Bridge`,set:'fields',mood:'night',cam:'bridge',cut:'faceoff',loc:`The canal bridge · Midnight`,cast:{afzal:'L1',sherm:'R1'},
  lines:[
    ['afzal',`Numberdar. Is nehar de do kinaare ne. Tu apne te reh, main apne te, te tinn hafte baad lok faisla karange.`,`Numberdar. This canal has two banks. You stay on yours, I'll stay on mine, and in three weeks the people decide.`],
    ['afzal',`Ya phir... paisa zaaya karna chhad. Baith ja. Main tere bandiyaan nu district council diyaan seataan dila dewaanga. Sab da faida.`,`Or... stop wasting money. Withdraw. I'll get your people the district council seats. Everybody wins.`],
    ['sherm',`Sahib, ohde bandiyaan de hath chaadraan de thalle ne. Saadiyaan de vi.`,`Sahib, his men have their hands under their chadors. So do ours.`]],
  choices:[
    {l:`Refuse with a stare`,d:`Say nothing. Hold his eyes until he looks away, then tell your drivers to move forward.`,fx:{khauf:10,izzat:8},
     r:[['nar',`Ten long seconds. Malik Tori looks away first. His convoy reverses off the bridge, and every driver on both sides saw it.`]]},
    {l:`Offer a clean contest`,d:`Shake his hand in front of both convoys: no violence, no rigging, and both sides accept the result.`,fx:{izzat:12,khauf:-6,joiya:6},flag:'pact',
     r:[['afzal',`Saaf larai. Theek ae. Vekhange haar ke vi tainu eh asool changa lagda ae ke nahin.`,`A clean fight. Fine. Let's see if you still like these rules when you lose.`]]},
    {l:`Take the deal`,d:`Withdraw from the race in exchange for district council seats.`,fx:{paisa:1,izzat:-10},next:'end_deal'}],
  next:'rigging'},

rigging:{title:`Election Eve`,set:'dera',mood:'night',cam:'gate',loc:`Dera gate · The night before polling`,cast:{sho:'L1',sherm:'R1'},
  lines:[
    ['nar',`Generators hum. Your workers stack voter slips and pack lunch boxes for 214 polling stations.`],
    ['sho',`Main dost ban ke aaya haan, Numberdar Sahib. Malik Tori de bande 112 te 113 number station te tinn vajay ton baad thappe laaun di koshish karange. Mere sipahi othay ne. Oh akkhaan band kar sakde ne, ohde layi ya tuhade layi.`,`I've come as a friend, Numberdar Sahib. Malik Tori's men will try to stuff boxes at Stations 112 and 113 after 3 PM. My constables are posted there. They can look away, for him or for you.`],
    ['sherm',`Sahib, asi subah tak 112 te chaali bande khare kar sakde haan.`,`Sahib, we can have forty men at 112 by sunrise.`]],
  choices:[
    {l:`Agents and cameras`,d:`Rs 50 lakh for trained polling agents, lawyers and phone cameras at every station.`,fx:{paisa:-.5,izzat:10},
     r:[['nar',`At 3:20 PM, a video from Station 112 shows Malik Tori's men with a sack of stamped ballots. Every channel has it by four.`]]},
    {l:`Accept the SHO's help`,d:`Let his constables look the other way, in your direction.`,fx:{taluqat:10,izzat:-10,khauf:8},flag:'rigged',
     r:[['sho',`Ho gaya samjho. Yaad rakhna ajj raat tuhade dost kaun san.`,`Consider it done. Remember who your friends were tonight.`]]},
    {l:`Go to the Returning Officer`,d:`Drive to the RO at midnight with the press and demand Rangers at the sensitive stations.`,fx:{izzat:8,taluqat:5,khauf:-4},req:s=>s.taluqat>=30||s.rel.dc>=50,rt:`Ta'aluqat 30 or DC relation 50`,
     r:[['nar',`The RO signs the order at 1:40 AM. Rangers take positions at 112 and 113 before dawn.`]]}],
  next:'count'},

count:{title:`Results Night`,set:'jalsa',mood:'night',cam:'wide',cut:'election',loc:`Your constituency · Polls closed at 5 PM`,
  lines:[
    ['nar',`Every television in the Dera is on. Unofficial results arrive station by station.`],
    {who:'nar',t:`One channel is running footage of constables stepping aside at Station 113. The Election Commission has asked for the tapes.`,when:s=>s.flags.rigged},
    {who:'danish',t:`Numberdar, Germany waale saare jaag rahe ne! Frankfurt wich vi TV laga hoya ae.`,en:`Numberdar, everyone in Germany is awake! The TV is on in Frankfurt too.`,when:s=>s.flags.germany},

function estateDefaults(s){
  if(s.acres==null)s.acres=52;if(!s.crops)s.crops={cotton:20,wheat:18,cane:8,mango:6};if(!s.staff)s.staff=STAFF0();if(!s.cars)s.cars=CARS0();if(!s.rel)s.rel=REL0();if(!s.ach)s.ach=[];if(s.story==null)s.story=0;if(s.season==null)s.season=0;if(!s.log)s.log=[];return s;
}
const lakh=r=>Math.round(r/1000)/100; // rupees -> lakh
function salaryPerSeason(s){return s.staff.reduce((a,m)=>a+m.sal,0)*6/1e7;} // crore
function maintPerSeason(s){return s.cars.reduce((a,c)=>a+(CARS[c]?.maint||0),0);}
function incomePerSeason(s){const mgr=s.staff.some(m=>m.role==='manager')?1.15:1;return Object.keys(CROPS).reduce((a,k)=>a+(s.crops[k]||0)*CROPS[k].per,0)*mgr;}
function seasonTick(){
  S.story=(S.story||0)+1;if(S.story%3!==0)return null;
  S.season=(S.season||0)+1;const kharif=S.season%2===1,luck=R(.8,1.25);
  const inc=+(incomePerSeason(S)*luck).toFixed(2),sal=+salaryPerSeason(S).toFixed(2),mt=+maintPerSeason(S).toFixed(2),net=+(inc-sal-mt).toFixed(2);
  S.lastHarvest={kharif,inc,sal,mt,net,luck:+luck.toFixed(2)};applyFx({paisa:net});
  S.staff.forEach(m=>m.loy=Math.max(0,Math.min(100,m.loy+(net>0?2:-6))));
  return S.lastHarvest;
}
function checkAch(){if(!S||!S.ach)return;for(const [id,n,d,t] of ACH){try{if(!S.ach.includes(id)&&t(S)){S.ach.push(id);toast(`Achievement: ${n}`,d);sfx('ach');}}catch(e){}}}
function toast(t,d){const el=document.createElement('div');el.className='toast';el.innerHTML=`<b></b><span></span>`;el.querySelector('b').textContent=t;el.querySelector('span').textContent=d||'';document.body.appendChild(el);setTimeout(()=>el.remove(),4200);}

/* ---- Dera management screen ---- */
let hubTab='zameen';
function openHub(tab){hubTab=tab||hubTab;$('#hub').hidden=false;renderHub();sfx('click');}
function closeHub(){$('#hub').hidden=true;renderHUD();checkAch();save();}
function hubBtn(label,act,dis,cls){return `<button type="button" class="hb ${cls||''}" data-act="${act}" ${dis?'disabled':''}>${label}</button>`;}
function renderHub(){
  const tabs=[['zameen','Zameen'],['mulazim','Mulazim'],['garage','Garage'],['rel',"Ta'aluqat"],['ach','Achievements']];
  let h=`<div class="hubhead"><div><div class="eyebrow">Your estate · Day ${S.day}</div><h2>The Dera of ${esc(S.name)}</h2></div><button type="button" class="hb ghost" data-act="close">Close ✕</button></div>
  <div class="hubtabs" role="tablist">${tabs.map(([k,n])=>`<button type="button" role="tab" aria-selected="${hubTab===k}" class="htab${hubTab===k?' on':''}" data-tab="${k}">${n}</button>`).join('')}</div><div class="hubbody">`;
  const sal=salaryPerSeason(S),inc=incomePerSeason(S),mt=maintPerSeason(S);

const FEMALE=new Set(['zainab','begum','saima','bashiran','lhw','student','woman']);
const VP={nar:[.85,.95],rafiq:[1.05,1.02],rasool:[.7,.9],asif:[1,1.1],ditta:[.85,.88],yaqoob:[.95,1],zainab:[1.25,1],sho:[.9,1.05],sherm:[.6,.92],afzal:[.75,.95],begum:[1.1,.98],saima:[1.3,1.12],general:[.7,.9],envoy:[1,.98],bashiran:[1.05,.85],patwari:[1.1,1.15],hamza:[1.05,1.12],danish:[.95,1.05],mureed:[.65,.88],siraj:[.85,.9],rana:[.8,.95],gul:[.9,1],farmer:[.8,.85],arhti:[1.1,1.15],lhw:[1.2,1.05],student:[1.35,1.1],mpa:[.85,1],dc:[.95,1]};

function pickVoice(lang,female,who){
  const order=lang==='en'?['en-PK','en-IN','en-GB','en-AU','en-US','en']:['pa','ur','hi','en-PK','en-IN','en'];
  const fem=/female|woman|zira|heera|swara|kalpana|veena|neerja|samantha|susan|hazel|lekha|aditi|uzma|salma|gul|ananya|google हिन्दी|google ਪੰਜਾਬੀ/i,mal=/\bmale|ravi|madhur|hemant|prabhat|david|daniel|rishi|asad|george|mark|arjun|kunal|ojas|aarav|salman/i;
  let best=null,bs=-1;
  TTS.voices.forEach((v,i)=>{const L=(v.lang||'').toLowerCase().replace('_','-');const oi=order.findIndex(p=>L.startsWith(p.toLowerCase()));if(oi<0)return;
    let sc=(order.length-oi)*10;if((female?fem:mal).test(v.name))sc+=6;else if((female?mal:fem).test(v.name))sc-=6;if(/natural|neural|online|premium|enhanced/i.test(v.name))sc+=5;if(/google/i.test(v.name))sc+=2;
    if(sc>bs){bs=sc;best=v;}});
  if(!best)return TTS.voices[0]||null;
  // give different men different voices where the device has several
  const same=TTS.voices.filter(v=>(v.lang||'').slice(0,2)===(best.lang||'').slice(0,2)&&!(female?mal:fem).test(v.name));
  if(same.length>1&&who){let h=0;for(const ch of who)h=(h*31+ch.charCodeAt(0))>>>0;const alt=same[h%same.length];if(/natural|neural|online|google/i.test(alt.name)||!/natural|neural|online|google/i.test(best.name))return alt;}
  return best;
}
function speak(l,text){
  if(TTS.mode==='off'||!window.speechSynthesis||!soundOn)return false;
  try{
    speechSynthesis.cancel();
    const nar=!l.who||l.who==='nar',lang=(nar||TTS.mode==='en'||!l.en)?'en':'pa',txt=lang==='en'&&l.en?fill(l.en):text;
    const u=new SpeechSynthesisUtterance(txt.replace(/["“”]/g,'').replace(/\.\.\./g,', ')),v=pickVoice(lang,FEMALE.has(l.who),l.who);
    if(v){u.voice=v;u.lang=v.lang;}const [p,r]=VP[l.who]||[1,1];u.pitch=p;u.rate=r*(nar?1:1);u.volume=1;
    u.onstart=()=>duck(1);u.onend=u.onerror=()=>{duck(0);$('#portrait').classList.remove('talk');};
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}

  add('☕','Receive a visitor at the Dera','Someone is waiting at the gate with a problem, an offer or an invitation.',()=>{$('#choices').innerHTML='';S.flags['vis_'+S.day]=1;visitor();},!vis);
  const ai=add('✦','Let Claude write what happens today','A brand-new situation, generated from your current state. Uses your Claude account.',()=>{S.flags['vis_'+S.day]=1;aiEvent(ai);},!vis);
  ai.hidden=true;SAMPLE.then(s=>{ai.hidden=!s||aiDown;});
  add('⌂','Manage the Dera','Land and crops, mulazim, garage, ta\'aluqat and achievements.',()=>openHub());
}
function visitor(){
  const pool=Object.keys(DAILY).filter(k=>!(S.flags.seen||[]).includes(k));const k=pool.length?pick(pool):pick(Object.keys(DAILY));

}
const SLOTS=['1','2','3'];
function slotKey(n){return KEY+'.slot'+n;}
function readSlot(n){try{return JSON.parse(localStorage.getItem(slotKey(n)));}catch(e){return null;}}
function openSaves(){
  hush();const live=$('#menu').hidden&&S&&S.story!=null,fromTitle=!$('#menu').hidden;
  const row=n=>{const d=readSlot(n);return `<div class="trow"><div><b>Slot ${n}</b><span>${d?`${esc(d.name)} · Stage ${d.stage} · Day ${d.day} · ${d.acres||52} acres · ${new Date(d.savedAt||0).toLocaleString()}`:'Empty'}</span></div><div class="row3">${live?`<button type="button" class="hb" data-save="${n}">Save here</button>`:''}${d?`<button type="button" class="hb" data-load="${n}">Load</button><button type="button" class="hb ghost" data-del="${n}">Delete</button>`:''}</div></div>`;};
  menu(`<div class="eyebrow">Saved games</div><h2 style="font-size:34px">Save & load</h2><p>The game also autosaves after every scene. Saves live in this browser.</p><div class="tbl" style="text-align:left">${SLOTS.map(row).join('')}</div><div class="row"><button class="big ghost" id="sv-close" type="button">Back</button><button class="big" id="sv-new" type="button">New game</button></div>`);
  $('#menu-card').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.save){try{localStorage.setItem(slotKey(b.dataset.save),JSON.stringify({...S,savedAt:Date.now()}));toast(`Saved to slot ${b.dataset.save}`,`Day ${S.day} · ${S.name}`);}catch(x){toast('Could not save','This browser is blocking storage.');}openSaves();}
    if(b.dataset.load){const d=readSlot(b.dataset.load);if(d){S=estateDefaults(Object.assign(DEF(),d));beginGame();toast(`Loaded slot ${b.dataset.load}`,`Day ${S.day}`);}}
    if(b.dataset.del){try{localStorage.removeItem(slotKey(b.dataset.del));}catch(x){}openSaves();}
    if(b.id==='sv-close'){if(fromTitle)titleScreen();else $('#menu').hidden=true;}
    if(b.id==='sv-new'){titleScreen();}
  };
}
