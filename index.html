<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rise of the Numberdar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@500&display=swap">
<style>
/* Layout: one-column game console. Scene window framed in truck-art trim, dialogue + choices below, stat ledger above. Single dark "dusk at the Dera" look by design. */
:root{
  --night:#15111f; --panel:#1f1828; --panel-2:#291f33; --line:#3d2f48;
  --gold:#e9b44c; --rose:#d4506a; --teal:#2fa38f; --parch:#f4e7cc; --muted:#b8a78f;
  --izzat:#e9b44c; --khauf:#e0607a; --paisa:#8ccf73; --taluq:#5db3e2;
  --f-display:'Rozha One', Georgia, 'Times New Roman', serif;
  --f-body:'Hind', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-urdu:'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
  --trim:repeating-linear-gradient(90deg,var(--gold) 0 14px,var(--rose) 14px 28px,var(--teal) 28px 42px,var(--parch) 42px 46px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1100px 560px at 50% -12%,#3b2342 0%,var(--night) 62%) var(--night);color:var(--parch);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:grid;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.1;color:var(--gold);text-wrap:balance}
.brand .ur{font-family:var(--f-urdu);font-size:15px;color:var(--muted);direction:rtl}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.pill b{color:var(--parch);font-weight:600}
.btn-s{cursor:pointer}
.btn-s:hover{border-color:var(--gold);color:var(--parch)}

/* stat ledger */
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{--c:var(--gold);position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;min-width:0}
.stat .lbl{display:flex;justify-content:space-between;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .lbl i{font-style:normal;font-family:var(--f-urdu);letter-spacing:0;text-transform:none;font-size:12px;line-height:1}
.stat .val{font-family:var(--f-display);font-size:24px;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.25}
.bar{height:6px;background:#0007;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.delta{position:absolute;right:10px;top:26px;font-family:var(--f-display);font-size:20px;pointer-events:none;animation:floatUp 1.8s ease-out forwards}
.delta.up{color:var(--paisa)} .delta.dn{color:var(--khauf)}
.subhud{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.subhud b{color:var(--parch);font-weight:500}
.loy{display:inline-block;width:70px;height:5px;border-radius:3px;background:#0007;vertical-align:middle;margin-left:6px;overflow:hidden}
.loy i{display:block;height:100%;background:var(--teal);transition:width .9s}

/* scene window */
.stage{position:relative;aspect-ratio:1200/560;max-width:100%;border-radius:14px;overflow:hidden;background:#0c0a12;box-shadow:0 0 0 2px var(--gold),0 0 0 6px var(--night),0 0 0 8px var(--teal),0 24px 60px #000a}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--trim);opacity:.9}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#world{transform-origin:0 0;transition:transform 1.8s cubic-bezier(.45,0,.2,1)}
.loc{position:absolute;left:12px;top:12px;z-index:3;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:#0009;border:1px solid #fff2;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:var(--ray,.5);background:linear-gradient(115deg,transparent 30%,#ffd9902a 42%,transparent 48%,#ffd99020 56%,transparent 64%);animation:rays 9s ease-in-out infinite alternate;transition:opacity 1.5s}
.leaves{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leaf{position:absolute;top:-5%;width:10px;height:6px;border-radius:0 70% 0 70%;background:#6f8f3a;animation:leafFall var(--t,9s) linear infinite,leafSpin 2.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4}
.fade.on{opacity:1}
.rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;background:repeating-linear-gradient(105deg,transparent 0 9px,#cfe3ff30 9px 10px);background-size:120px 120px;animation:rain .35s linear infinite}
.rain.on{opacity:1}

/* svg actors */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite}
.cheer{animation:cheer .9s ease-in-out infinite}
.scan{transform-box:fill-box;transform-origin:50% 100%;animation:scan 7s steps(1) infinite}
.arm,.leg,.lg{transform-box:view-box}
.sip{animation:sip 5s ease-in-out infinite}
.scrub{animation:scrub 1.1s ease-in-out infinite}
.wave{animation:waveArm 1s ease-in-out infinite}
.orate{animation:orate 2.6s ease-in-out infinite}
.raise{animation:raise 1.6s ease-in-out 1}
.flagw{transform-box:fill-box;transform-origin:0 100%;animation:flagw 1.2s ease-in-out infinite}
.glint{opacity:0;animation:glint 5s ease-in-out infinite}
.splash circle{opacity:0;animation:splash 1.1s ease-out infinite}
.cross{animation:cross var(--t,40s) linear infinite;animation-delay:var(--d,0s)}
.crossR{animation:crossR var(--t,40s) linear infinite;animation-delay:var(--d,0s)}
.patrol{animation:patrol 16s ease-in-out infinite alternate}
.run{animation:runBob .35s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.set{transition:opacity .2s}
.actor{animation:enter .8s ease-out both}
#sun{transition:cy 2s ease,cx 2s ease,fill 1s}

/* dialogue */
.dialog{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;align-items:start;background:linear-gradient(180deg,var(--panel),#18121f);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;user-select:none}
.dialog::before{content:"";position:absolute;left:14px;right:14px;top:-3px;height:5px;border-radius:3px;background:var(--trim)}
.portrait{width:112px;height:112px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:#2a2133;box-shadow:0 6px 22px #0008}
.portrait svg{width:100%;height:100%;display:block}
.portrait.talk .mouth{animation:talk .18s ease-in-out infinite}
.mouth{transform-box:fill-box;transform-origin:50% 50%}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.who{font-family:var(--f-display);font-size:21px;color:var(--gold);line-height:1.2}
.role{font-size:13px;color:var(--muted);margin-bottom:6px}
.text{font-size:17.5px;line-height:1.6;max-width:68ch;min-height:4.8em}
.text em{color:var(--gold);font-style:normal}
.more{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;animation:nudge 1.2s ease-in-out infinite}

/* choices */
.choices{display:grid;gap:10px}
.choices .ask{font-family:var(--f-display);font-size:19px;color:var(--parch)}
.choice{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;animation:rise .45s ease-out both}
.choice:hover:not([disabled]),.choice:focus-visible{border-color:var(--gold);background:var(--panel-2);transform:translateY(-2px);outline:none}
.choice .k{font-family:var(--f-display);font-size:22px;height:42px;display:grid;place-items:center;border-radius:9px;background:var(--gold);color:var(--night)}
.choice b{display:block;font-size:16.5px;font-weight:600}
.choice .d{display:block;color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.lock{color:var(--muted)}
.choice[disabled]{opacity:.5;cursor:not-allowed}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;overflow:hidden}
.ov>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:3;transition:height 1.1s ease}
.lb.t{top:0}.lb.b{bottom:0}
.ov.on .lb{height:11vh}
.cs-kicker{position:absolute;top:calc(11vh + 14px);left:16px;right:16px;text-align:center;z-index:4;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.85}
.cs-cap{position:absolute;left:16px;right:16px;bottom:calc(11vh + 56px);z-index:4;text-align:center;padding:14px 12px;background:radial-gradient(ellipse at center,#000b 0%,#0007 45%,transparent 72%);transition:opacity .8s,transform .8s}
.cs-cap.out{opacity:0;transform:translateY(8px)}
.cs-cap h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,44px);margin:0 auto;max-width:24ch;line-height:1.15;text-shadow:0 2px 24px #000,0 0 2px #000;text-wrap:balance}
.cs-cap p{margin:8px auto 0;max-width:60ch;font-size:clamp(14px,1.7vw,18px);font-style:italic;color:var(--parch);text-shadow:0 1px 12px #000}
.cs-btn{position:absolute;z-index:10;right:16px;bottom:calc(11vh + 14px);background:#000a;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:7px 16px;cursor:pointer;letter-spacing:.08em;font-size:13px}
.cs-btn:hover{background:var(--gold);color:var(--night)}
.card{position:relative;z-index:4;width:min(640px,100%);margin-inline:16px;background:linear-gradient(180deg,#221a2c,#140f1b);border:1px solid var(--line);border-radius:16px;padding:28px 24px 24px;box-shadow:0 30px 80px #000c;text-align:center;max-height:calc(100% - 32px);overflow:auto}
.card::before{content:"";position:absolute;left:18px;right:18px;top:-3px;height:6px;border-radius:3px;background:var(--trim)}
.card .ur{font-family:var(--f-urdu);font-size:22px;color:var(--gold);direction:rtl;line-height:2}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1.05;margin:4px 0 8px;color:var(--parch);text-wrap:balance}
.card p{color:var(--muted);margin:0 auto 14px;max-width:52ch}
.card label{display:block;text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.card input{width:100%;background:#0006;border:1px solid var(--line);color:var(--parch);border-radius:10px;padding:11px 12px;font:inherit;font-size:17px}
.card input:focus{border-color:var(--gold);outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.big{background:var(--gold);color:var(--night);border:0;border-radius:99px;padding:12px 26px;font-family:var(--f-display);font-size:19px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.big:hover{transform:translateY(-2px);box-shadow:0 8px 24px #e9b44c55}
.big.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left;margin-top:16px;font-size:13.5px;color:var(--muted)}
.howto div{background:#0004;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.howto b{display:block;font-weight:600}
.endstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.endstats div{background:#0005;border-radius:10px;padding:8px 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.endstats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--parch);letter-spacing:0}
.stagecard .num{font-family:var(--f-display);font-size:clamp(70px,14vw,150px);line-height:1;color:var(--gold);text-shadow:0 0 50px #e9b44c66}

/* keyframes */
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(1deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes sip{0%,62%,100%{transform:rotate(0)}72%,88%{transform:rotate(-125deg)}}
@keyframes scrub{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(-95deg)}}
@keyframes waveArm{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-120deg)}}
@keyframes orate{0%,100%{transform:rotate(-20deg)}40%{transform:rotate(-140deg)}60%{transform:rotate(-130deg)}}
@keyframes raise{0%{transform:rotate(0)}25%,70%{transform:rotate(-160deg)}100%{transform:rotate(0)}}
@keyframes flagw{0%,100%{transform:skewY(-6deg) scaleX(1)}50%{transform:skewY(6deg) scaleX(.85)}}
@keyframes glint{0%,78%,100%{opacity:0}86%{opacity:.85}}
@keyframes splash{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,8px),-22px);opacity:0}}
@keyframes cross{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes crossR{from{transform:translateX(1420px)}to{transform:translateX(-220px)}}
@keyframes patrol{from{transform:translateX(0)}to{transform:translateX(190px)}}
@keyframes runBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.25)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes rays{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes leafFall{0%{top:-5%;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:104%;opacity:0}}
@keyframes leafSpin{from{transform:translateX(-14px) rotate(-30deg)}to{transform:translateX(18px) rotate(220deg)}}
@keyframes rain{from{background-position:0 0}to{background-position:-30px 120px}}
@keyframes meetL{0%,15%{transform:translateX(0)}70%,100%{transform:translateX(98px)}}
@keyframes meetR{0%,15%{transform:translateX(0)}70%,100%{transform:translateX(-98px)}}
@keyframes heli{from{transform:rotate(-5deg) scale(1.08)}to{transform:rotate(4deg) scale(1.28)}}
@keyframes drive{from{transform:translateX(-700px)}to{transform:translateX(1500px)}}
@keyframes walkUp{0%{transform:translate(600px,640px) scale(2.6)}100%{transform:translate(600px,352px) scale(1.05)}}
@keyframes flash{0%,100%{opacity:0}4%{opacity:1}12%{opacity:0}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes lean{0%,70%{transform:rotate(0)}100%{transform:rotate(6deg)}}
@keyframes leanR{0%,70%{transform:rotate(0)}100%{transform:rotate(-6deg)}}

/* v2: atmosphere, walking, horses, gunfights */
.stage::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 95% at 50% 42%,transparent 58%,#000a 100%)}
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.loc-title{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:3;text-align:center;pointer-events:none;opacity:0;width:min(90%,640px)}
.loc-title.go{animation:locIn 4.4s ease both}
.loc-title small{display:block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 8px #000}
.loc-title span{display:block;font-family:var(--f-display);font-size:clamp(22px,3.6vw,40px);color:#fff;text-shadow:0 2px 18px #000,0 0 2px #000;line-height:1.1}
.sub{font-size:14.5px;color:var(--muted);font-style:italic;max-width:68ch;margin-top:4px}
.tribe{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tribe.enemy b{color:var(--khauf)}
.tribe.enemy .loy i{background:var(--khauf)}
.walk .leg{animation:legSwing .42s ease-in-out infinite alternate}
.walk .leg-r{animation-direction:alternate-reverse}
.walk .arm{animation:armSwing .42s ease-in-out infinite alternate!important}
.walk .arm.fr{animation-direction:alternate-reverse!important}
.actor-in{animation:walkIn 1.7s cubic-bezier(.3,.6,.4,1) both}
.speaking .arm.fr{animation:gesture 1.6s ease-in-out infinite}
.speaking>g>g{animation:speakBob .7s ease-in-out infinite}
.drift{animation:drift var(--t,120s) linear infinite;animation-delay:var(--d,0s)}
.flow{stroke-dasharray:18 14;animation:flowDash 1.2s linear infinite}
.smoke circle{transform-box:fill-box;transform-origin:50% 50%;animation:smoke 4s ease-out infinite;opacity:0}
.fire{animation:fire .22s steps(2) infinite}
.peck{transform-box:fill-box;transform-origin:30% 90%;animation:peck 2.2s ease-in-out infinite}
.sweep{transform-box:fill-box;transform-origin:50% 0;animation:sweep 5s ease-in-out infinite alternate}
.rise-water{animation:riseW 10s ease-in-out both}
.typing-line{transform-box:fill-box;transform-origin:0 50%;animation:typeLine 1.6s steps(12) infinite}
.blinkdot{animation:twinkle 1.2s ease-in-out infinite}
.fly{animation:flyAway 6s ease-in 1s both}
.sceneA{animation:sceneOut 1s ease 4.6s both}
.sceneB{animation:sceneIn 1s ease 4.6s both}
.rainfall{animation:rainfall .35s linear infinite}
.lflash{animation:flash 5s 1.2s infinite;opacity:0}
.gallop .lg{animation:gallopLeg .48s ease-in-out infinite}
.gallop .lg2{animation-delay:-.1s}.gallop .lg3{animation-delay:-.24s}.gallop .lg4{animation-delay:-.34s}
.gallop .hb{animation:hbob .24s ease-in-out infinite alternate}
.trot .lg{animation:gallopLeg 1s ease-in-out infinite}.trot .lg2,.trot .lg3{animation-delay:-.5s}
.muzzle{opacity:0;transform-box:fill-box;transform-origin:0 50%;animation:muzzle var(--mt,.9s) steps(1) infinite;animation-delay:var(--md,0s)}
.tracer{stroke-dasharray:30 600;animation:tracer var(--mt,.9s) linear infinite;animation-delay:var(--md,0s)}
.spark{opacity:0;animation:spark var(--mt,1.1s) ease-out infinite;animation-delay:var(--md,0s)}
.shake{animation:shake .18s steps(2) infinite}
.zoomP{transform-box:fill-box;transform-origin:50% 50%;animation:zoomP 9s ease-out both}
@keyframes locIn{0%{opacity:0;transform:translate(-50%,10px)}14%,76%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes legSwing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes armSwing{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes walkIn{from{transform:translateX(var(--from,-300px))}to{transform:translateX(0)}}
@keyframes gesture{0%,100%{transform:rotate(0)}30%{transform:rotate(-62deg)}55%{transform:rotate(-36deg)}75%{transform:rotate(-52deg)}}
@keyframes speakBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1500px)}}
@keyframes flowDash{to{stroke-dashoffset:-64}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.45}100%{transform:translate(18px,-90px) scale(2.6);opacity:0}}
@keyframes fire{0%{opacity:1}50%{opacity:.55}}
@keyframes peck{0%,60%,100%{transform:rotate(0)}70%,80%{transform:rotate(38deg)}}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes riseW{from{transform:translateY(90px)}to{transform:translateY(0)}}
@keyframes typeLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flyAway{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(900px,-420px) rotate(-14deg) scale(.35)}}

<script>
/* ============ ART: people, portraits, vehicles, sets ============ */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SKIN=['#c68a5e','#b07a4f','#9a6844','#d39b6c','#a8734a','#8c5a3a'];
const CLOTH=['#e9e2d0','#cfc6ae','#a9b4a8','#8d9aa6','#c7a98a','#7d8c6e','#d8cfb8','#b9a27c','#9aa7b8'];
const DUP=['#b8476a','#d9822b','#4f7f9e','#8a4fa0','#c9a227','#2f8a6f','#a33b3b'];
const PARTY='#1d7a4c';

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);}
function person(o){
  const s=o.s||1,skin=o.skin||'#b07a4f',kam=o.kam||'#e9e2d0',sh=o.sh||kam,head=o.head||'none',hc=o.hc||'#f4f1e8',shoe=o.shoe||'#4a3322';
  const chad=head==='chador',top=chad?hc:kam,topD=shade(top,-.22),skD=shade(skin,-.18),hem=o.long?-6:-19,dl=(o.delay!=null?o.delay:R(0,4)).toFixed(2);
  let g=`<g class="p ${o.cls||''}" transform="translate(${o.x||0} ${o.y||0}) scale(${o.flip?-s:s} ${s})" style="--dl:${dl}s"><g class="${o.anim||''}${o.act?' act':''}" style="animation-delay:${dl}s">`;
  g+=`<ellipse cx="0" cy="1" rx="15" ry="3.2" fill="#000" opacity=".24"/>`;
  if(!o.seated){
    const leg=(side)=>{const m=side;return `<g class="leg${m>0?' leg-r':''}" style="transform-origin:${5*m}px -40px"><path d="M${11*m},-40 Q${14.5*m},-22 ${9.5*m},-5 L${3.5*m},-5 Q${1.5*m},-22 0,-40Z" fill="${m>0?shade(sh,-.12):sh}"/><path d="M${9.6*m},-6 Q${6.5*m},-4 ${3.4*m},-6" stroke="${shade(sh,-.3)}" stroke-width="1" fill="none"/><rect x="${m>0?3.2:-9.8}" y="-6" width="6.6" height="2.4" fill="${skin}"/><path d="M${m>0?2.4:-11.4},-.6 Q${m>0?2.4:-11.4},-4.2 ${m>0?6:-7.8},-4.2 L${m>0?9.6:-4.2},-4.2 Q${m>0?11.6:-2.4},-4.2 ${m>0?11.6:-2.4},-1.6 L${m>0?11.6:-2.4},.4 L${m>0?2.4:-11.4},.4Z" fill="${shoe}"/></g>`;};
    g+=leg(-1)+leg(1);
  }
  if(chad)g+=`<path d="M-10.5,-68 Q-12,-86 0,-86.5 Q12,-86 10.5,-68 L17.5,${hem+4} Q0,${hem+8} -17.5,${hem+4}Z" fill="${hc}"/><path d="M-6,-60 Q-9,-40 -11,${hem+6} M6,-60 Q9,-40 11,${hem+6}" stroke="${shade(hc,-.25)}" stroke-width="1" fill="none" opacity=".7"/>`;
  const arm=(m,cls,extra)=>`<g class="arm ${m>0?'fr ':''}${cls||''}" style="transform-origin:${13*m}px -56px;animation-delay:${o.adelay!=null?o.adelay:dl}s"><path d="M${10*m},-58 Q${16.5*m},-58.5 ${17.6*m},-50 L${18*m},-41 L${12.4*m},-40.5 L${11*m},-50Z" fill="${m>0?shade(top,-.06):topD}"/><g class="fore" style="transform-origin:${15*m}px -41px;animation-delay:inherit"><path d="M${12.4*m},-41.5 L${18*m},-41.5 L${17.8*m},-30 L${13*m},-30Z" fill="${m>0?shade(top,-.1):topD}"/><path d="M${12.8*m},-31 L${17.9*m},-31" stroke="${shade(top,-.35)}" stroke-width="1.6"/><ellipse cx="${15.4*m}" cy="-26.6" rx="2.7" ry="3.5" fill="${m>0?skin:skD}"/><path d="M${13.2*m},-28 q${-1.4*m},1.6 ${-.6*m},3.2" stroke="${skD}" stroke-width="1.1" fill="none"/>${extra||''}</g></g>`;
  let props='';
  if(o.cup)props+=`<path d="M12.4,-29.5 h6.6 l-1,6 h-4.6z" fill="#b5653a"/><path d="M12.4,-29.5 h6.6" stroke="#8a4a2a"/>`;
  if(o.kettle)props+=`<path d="M10,-27 q5.5,-7 11,0 v6.5 h-11z" fill="#262626"/><path d="M21,-24 l5,-4" stroke="#262626" stroke-width="2"/>`;
  if(o.mic)props+=`<rect x="13.6" y="-33" width="3.6" height="9" rx="1.6" fill="#1a1a1a"/><circle cx="15.4" cy="-33" r="2.6" fill="#555"/>`;
  if(o.rag)props+=`<rect x="11.5" y="-27" width="9" height="5" rx="1" fill="#e2d6b0"/>`;
  if(o.stick)props+=`<path d="M15.4,-26 L15.4,-82" stroke="#7a5230" stroke-width="2.6" stroke-linecap="round"/>`;
  if(o.gun)props+=`<path d="M12,-28 L44,-32" stroke="#1d1d1d" stroke-width="3.4" stroke-linecap="round"/><path d="M12,-28 L5,-24" stroke="#6a4424" stroke-width="5" stroke-linecap="round"/>`;
  if(o.flag)props+=`<g class="flagw" style="animation-delay:${o.adelay||0}s"><line x1="15.4" y1="-24" x2="15.4" y2="-56" stroke="#e8e0cc" stroke-width="1.1"/><path d="M15.4,-56 h13 v8.5 h-13z" fill="${o.flag}"/><path d="M15.4,-56 h3.5 v8.5 h-3.5z" fill="#fff"/></g>`;
  g+=arm(-1,o.barm);
  g+=`<g class="tor" style="animation-delay:${dl}s">`;
  g+=`<path d="M-12.5,-58.5 Q-15.5,-56.5 -15,-50 L-13.4,-42 Q-15.6,-30 -16.2,${hem} Q0,${hem+2.6} 16.2,${hem} Q15.6,-30 13.4,-42 L15,-50 Q15.5,-56.5 12.5,-58.5 Q0,-61.5 -12.5,-58.5Z" fill="${top}"/>`;

  if(!chad)g+=`<path d="M0,-60.5 L0,-44" stroke="#000" stroke-opacity=".22" stroke-width="1"/><path d="M-3.6,-61.2 Q0,-58.8 3.6,-61.2" stroke="${topD}" stroke-width="1.6" fill="none"/>${[-56,-52,-48].map(y=>`<circle cx="0" cy="${y}" r=".75" fill="${o.long?'#d8b04a':shade(top,-.4)}"/>`).join('')}`;
  if(o.long)for(let y=-44;y<-10;y+=6)g+=`<circle cx="0" cy="${y}" r=".9" fill="#d8b04a"/>`;
  if(o.vest){const vd=shade(o.vest,-.25);g+=`<path d="M-12.5,-58.5 Q-15.4,-50 -14.4,-36.5 L-2.6,-36.5 L-1.6,-61Z" fill="${o.vest}"/><path d="M12.5,-58.5 Q15.4,-50 14.4,-36.5 L2.6,-36.5 L1.6,-61Z" fill="${vd}"/><path d="M-1.6,-61 L-4.6,-52 M1.6,-61 L4.6,-52" stroke="${shade(o.vest,.25)}" stroke-width=".8"/>${[-54,-49,-44,-39].map(y=>`<circle cx="-2.4" cy="${y}" r=".8" fill="#e8d8b0"/>`).join('')}`;}
  if(o.uniform)g+=`<rect x="-14.4" y="-41" width="28.8" height="3" fill="#2a1f14"/><rect x="-1.6" y="-41" width="3.2" height="3" fill="#c9a227"/><rect x="-11" y="-56" width="5" height="2.6" fill="#c9a227"/>`;
  if(o.rifle)g+=`<path d="M-12,-58 L13,-24" stroke="#6b4a2a" stroke-width="3.2"/>${[0,1,2,3].map(i=>`<rect x="${-8+i*5.5}" y="${-52+i*7.4}" width="2.2" height="4" fill="#c9a227" transform="rotate(-36 ${-7+i*5.5} ${-50+i*7.4})"/>`).join('')}`;
  g+=`</g>`;
  // neck + head
  g+=`<path d="M-3.2,-66 L-3.2,-60.5 Q0,-58.8 3.2,-60.5 L3.2,-66Z" fill="${skD}"/>`;
  g+=`<g class="hd" style="transform-origin:0 -63px;animation-delay:${dl}s">`;
  if(!o.back){
    g+=`<ellipse cx="-7.3" cy="-72.2" rx="1.6" ry="2.6" fill="${skD}"/><ellipse cx="7.3" cy="-72.2" rx="1.6" ry="2.6" fill="${skD}"/>`;
    g+=`<path d="M-7.3,-74 Q-7.6,-81.6 0,-81.8 Q7.6,-81.6 7.3,-74 Q7.2,-67.5 4.6,-64.6 Q2.4,-63 0,-63 Q-2.4,-63 -4.6,-64.6 Q-7.2,-67.5 -7.3,-74Z" fill="${skin}"/>`;
    g+=`<path d="M2.2,-81.5 Q7.6,-80.4 7.3,-74 Q7.2,-67.5 4.6,-64.6 Q2.6,-63.3 1.6,-63.3 Q5.2,-68 4.8,-74 Q4.6,-79 2.2,-81.5Z" fill="#000" opacity=".1"/>`;
    if(o.beard)g+=`<path d="M-7.3,-73.5 Q-7.8,-63.5 0,-61.2 Q7.8,-63.5 7.3,-73.5 Q6.4,-67.8 3.4,-66.6 Q0,-67.6 -3.4,-66.6 Q-6.4,-67.8 -7.3,-73.5Z" fill="${o.beard}"/>`;
    g+=`<g class="eyesS" style="animation-delay:${dl}s"><ellipse cx="-2.9" cy="-73.8" rx="1.55" ry="1" fill="#f3ece2"/><ellipse cx="2.9" cy="-73.8" rx="1.55" ry="1" fill="#f3ece2"/><circle cx="-2.75" cy="-73.8" r=".78" fill="#2a1a10"/><circle cx="3.05" cy="-73.8" r=".78" fill="#2a1a10"/><path d="M-4.5,-74.6 Q-2.9,-75.3 -1.3,-74.6 M1.3,-74.6 Q2.9,-75.3 4.5,-74.6" stroke="${skD}" stroke-width=".6" fill="none"/></g>`;
    g+=`<path d="${o.stern?'M-4.9,-76.6 L-1.2,-75.7 M1.2,-75.7 L4.9,-76.6':'M-4.8,-75.9 Q-3,-77 -1.2,-76.2 M1.2,-76.2 Q3,-77 4.8,-75.9'}" stroke="#20140e" stroke-width="1" fill="none" stroke-linecap="round"/>`;
    g+=`<path d="M.2,-73.2 Q-1,-70 -.4,-69.2 Q.6,-68.8 1.5,-69.4" stroke="${skD}" stroke-width=".85" fill="none" stroke-linecap="round"/>`;
    g+=`<path class="mth" d="M-1.9,-66.7 Q0,-65.9 1.9,-66.7" stroke="#6a2e26" stroke-width="1" fill="none" stroke-linecap="round" style="transform-origin:0 -66.5px"/>`;
    if(o.must)g+=`<path d="M-3.9,-67.9 Q0,-70 3.9,-67.9 Q2.2,-67.1 0,-67.7 Q-2.2,-67.1 -3.9,-67.9Z" fill="${o.must}"/>`+(o.curl?`<path d="M-3.9,-67.9 q-1.8,0 -1.6,-2 M3.9,-67.9 q1.8,0 1.6,-2" stroke="${o.must}" stroke-width="1" fill="none"/>`:'');
    if(o.shades)g+=`<path d="M-5.2,-75 h4.4 q0,2.6 -2.2,2.6 q-2.2,0 -2.2,-2.6Z M.8,-75 h4.4 q0,2.6 -2.2,2.6 q-2.2,0 -2.2,-2.6Z M-.8,-74.6 h1.6" fill="#0d0d0f" stroke="#0d0d0f" stroke-width=".6"/>`;
    if(o.glasses)g+=`<g fill="none" stroke="#1d1d1d" stroke-width=".6"><circle cx="-2.9" cy="-73.8" r="2"/><circle cx="2.9" cy="-73.8" r="2"/><path d="M-.9,-73.8 h1.8"/></g>`;
  } else g+=`<path d="M-7.6,-66 Q-8.8,-82.6 0,-82.8 Q8.8,-82.6 7.6,-66 Q4,-63.5 0,-63.4 Q-4,-63.5 -7.6,-66Z" fill="${o.hair||'#120e0c'}"/>`;
  const H={
    turban:`<path d="M-8.4,-74 Q-9.8,-87.4 0,-88 Q9.8,-87.4 8.4,-74 Q0,-78.6 -8.4,-74Z" fill="${hc}"/><path d="M-7.6,-78 Q0,-82.4 7.6,-78 M-7,-82.4 Q0,-86 7,-82.4" stroke="#000" stroke-opacity=".12" stroke-width="1" fill="none"/><path d="M2.6,-86.6 L8.6,-97.6 L13,-93.6 L7.2,-84.4Z" fill="${hc}"/><path d="M8.6,-97.6 L13,-93.6" stroke="#000" stroke-opacity=".15"/>`,
    cap:`<path d="M-7.4,-77 Q-7.6,-84.4 0,-84.6 Q7.6,-84.4 7.4,-77 Q0,-79.2 -7.4,-77Z" fill="${hc}"/><path d="M-6.6,-79.6 Q0,-81.6 6.6,-79.6" stroke="#000" stroke-opacity=".18" stroke-dasharray="1.2 1.2" fill="none"/>`,
    hair:`<path d="M-7.7,-72.5 Q-8.9,-83 0,-83.2 Q8.9,-83 7.7,-72.5 Q7,-78.2 3,-79 Q-1.6,-77.2 -5.4,-78.6 Q-7.2,-76.6 -7.7,-72.5Z" fill="${hc}"/><path d="M-4,-81.6 Q0,-82.6 4,-81" stroke="#fff" stroke-opacity=".12" stroke-width=".8" fill="none"/>`,
    chador:`<path d="M-9.8,-64 Q-11.4,-86.6 0,-86.8 Q11.4,-86.6 9.8,-64 Q8.8,-80.4 0,-81 Q-8.8,-80.4 -9.8,-64Z" fill="${hc}"/><path d="M-8.6,-70 Q-8,-80 0,-80.6" stroke="${shade(hc,-.25)}" stroke-width=".8" fill="none"/>`,
    police:`<path d="M-8.2,-78 L-7.4,-86 L7.4,-86 L8.2,-78Z" fill="${hc}"/><path d="M-9.6,-78 L7.4,-78 L5.4,-76 L-9.6,-76.4Z" fill="#111"/><circle cx="0" cy="-82" r="1.5" fill="#c9a227"/>`,
    beret:`<path d="M-8.2,-77 Q-10.4,-86.4 2,-87.2 Q11.4,-86.4 8.4,-78Z" fill="${hc}"/><circle cx="5" cy="-81.6" r="1.3" fill="#c9a227"/>`,
    jinnah:`<path d="M-7.6,-77 L-7.2,-86.2 Q0,-88.2 7.2,-86.2 L7.6,-77 Q0,-79.2 -7.6,-77Z" fill="${hc}"/><path d="M-7,-81.6 Q0,-83.6 7,-81.6" stroke="#000" stroke-opacity=".2" fill="none"/>`
  };
  g+=H[head]||'';
  if(o.bandage)g+=`<path d="M-7.6,-79 Q0,-82 7.6,-79 L7.6,-76.4 Q0,-79.4 -7.6,-76.4Z" fill="#f1ece0"/><circle cx="3" cy="-78.4" r="1.3" fill="#a33"/>`;
  g+=`</g>`;
  g+=arm(1,o.arm,props);
  return g+'</g></g>';
}

function villager(x,y,s,extra){
  const woman=Math.random()<.22;
  const o={x,y,s,skin:pick(SKIN),kam:pick(CLOTH),anim:'bob',delay:R(0,3)};
  if(woman){o.head='chador';o.hc=pick(DUP);}
  else{
    const h=Math.random();
    if(h<.35){o.head='turban';o.hc=pick(['#f4f1e8','#efe8d5','#e9d9a8'])}
    else if(h<.6){o.head='cap';o.hc=pick(['#f1ece0','#3a3a3a','#7a2a2a'])}
    else {o.head='hair';o.hc='#1b1512'}
    if(Math.random()<.5) o.beard=pick(['#1b1512','#e8e6e0','#c4541f','#6c6a66']);
    else if(Math.random()<.6) o.must='#1b1512';
  }
  return person(Object.assign(o,extra||{}));
}

const AMB={cv:null,ctx:null,mood:'dawn',set:'dera',P:[],birds:[],flash:0,t:0};
function ambInit(){
  const cv=document.createElement('canvas');cv.id='amb';$('#stage').insertBefore(cv,$('#rays'));AMB.cv=cv;AMB.ctx=cv.getContext('2d');
  const fit=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);};fit();addEventListener('resize',fit);
  for(let i=0;i<46;i++)AMB.P.push({x:Math.random(),y:Math.random(),vx:R(-.0004,.0004),vy:R(-.0003,.0001),r:R(.6,2.2),ph:R(0,6.28)});
  if(!reduced())requestAnimationFrame(ambLoop);
}
function ambMood(set,mood){AMB.set=set;AMB.mood=mood;}
function ambLoop(){
  requestAnimationFrame(ambLoop);if(document.hidden)return;
  const {cv,ctx}=AMB,W=cv.width,H=cv.height,d=devicePixelRatio||1,m=AMB.mood,s=AMB.set;AMB.t++;ctx.clearRect(0,0,W,H);
  const ff=(m==='night'||m==='dusk')&&(s==='dera'||s==='fields'),dust=['dawn','golden','noon'].includes(m)&&s!=='isb';
  if(ff||dust)for(const p of AMB.P){
    p.x+=p.vx+(ff?Math.sin(AMB.t/60+p.ph)*.0006:0);p.y+=p.vy+(ff?Math.cos(AMB.t/70+p.ph)*.0004:0);
    if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
    const a=ff?Math.max(0,Math.sin(AMB.t/25+p.ph))*.9:.22+.18*Math.sin(AMB.t/40+p.ph),X=p.x*W,Y=(ff?.45+p.y*.55:p.y)*H;
    ctx.fillStyle=ff?`rgba(210,255,120,${a})`:`rgba(255,236,190,${a})`;ctx.beginPath();ctx.arc(X,Y,p.r*d*(ff?1.3:1),0,6.28);ctx.fill();
    if(ff&&a>.5){ctx.fillStyle=`rgba(210,255,120,${a*.15})`;ctx.beginPath();ctx.arc(X,Y,p.r*d*6,0,6.28);ctx.fill();}
  }
  if(['dawn','golden','noon','dusk'].includes(m)&&s!=='isb'){
    if(!AMB.birds.length&&Math.random()<.005){const dir=Math.random()<.5?1:-1,y=R(.06,.26),n=4+Math.floor(R(0,5));for(let i=0;i<n;i++)AMB.birds.push({x:dir>0?-.05-i*.03:1.05+i*.03,y:y+(i%2?1:-1)*i*.008,v:.0016*dir*R(.9,1.1),ph:R(0,6)});}
    ctx.strokeStyle=m==='noon'?'rgba(40,40,50,.8)':'rgba(30,20,30,.85)';ctx.lineWidth=1.6*d;
    for(const b of AMB.birds){b.x+=b.v;const w=Math.sin(AMB.t/5+b.ph)*4*d,X=b.x*W,Y=b.y*H;ctx.beginPath();ctx.moveTo(X-7*d,Y-w);ctx.quadraticCurveTo(X-3*d,Y-2*d,X,Y);ctx.quadraticCurveTo(X+3*d,Y-2*d,X+7*d,Y-w);ctx.stroke();}
    AMB.birds=AMB.birds.filter(b=>b.x>-.4&&b.x<1.4);
  }else AMB.birds=[];
  if(m==='storm'&&AMB.flash<=0&&Math.random()<.004){AMB.flash=1;if(live())thunder(now()+R(.2,.8));}
  if(AMB.flash>0){ctx.fillStyle=`rgba(230,240,255,${AMB.flash*.55})`;ctx.fillRect(0,0,W,H);AMB.flash-=.06;}
}

const AU={ctx:null,beds:[],key:'',mood:'',set:'',stage:0,next:0,bc:0,mel:4};

const now=()=>AU.ctx.currentTime;

function audioTick(){

  if(['dawn','golden','noon'].includes(m)&&s!=='isb'&&r()<(m==='dawn'?.13:.06)){const f=R(2300,3600),n=2+Math.floor(r()*3);for(let i=0;i<n;i++)tone(f*R(.95,1.05),t+i*.11,.08,'sine',.035,f*R(1.15,1.4),A);}

function particles(kind){
  if(!kind||reduced())return()=>{};
  const cv=$('#cs-fx'),ctx=cv.getContext('2d'),dp=devicePixelRatio||1;let W=cv.width=innerWidth*dp,H=cv.height=innerHeight*dp;
  const conf=['#e9b44c','#d4506a','#2fa38f','#ffffff','#1d7a4c'],pet=['#d4325a','#e8506e','#b81f45','#f07a8e'],gold=['#ffd27a','#fff3c4'];
  const mk=init=>{const k=kind==='snow'?'s':kind==='mixed'?pick(['p','p','c']):kind==='confetti'?'c':kind==='gold'?'g':'p';return{x:Math.random()*W,y:init?Math.random()*H:-20,vx:R(-.4,.4)*dp,vy:R(.6,1.9)*dp*(k==='g'||k==='s'?.45:1),r:R(4,9)*dp,a:R(0,6.28),va:R(-.06,.06),k,c:pick(k==='c'?conf:k==='g'?gold:pet)};};
  const P=Array.from({length:kind==='gold'?80:150},()=>mk(1));let on=true,t=0;
  (function loop(){if(!on)return;t++;ctx.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx+Math.sin((t+p.r*10)/40)*.6;p.y+=p.vy;p.a+=p.va;if(p.y>H+20)Object.assign(p,mk(0));ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
    if(p.k==='p'){ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,6.28);ctx.fill();}else if(p.k==='c'){ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}else if(p.k==='s'){ctx.globalAlpha=.85;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,p.r*.32,0,6.28);ctx.fill();}else{ctx.globalAlpha=.5+.5*Math.sin(t/10+p.r);ctx.beginPath();ctx.arc(0,0,p.r*.28,0,6.28);ctx.fill();}
    ctx.restore();}requestAnimationFrame(loop);})();
  return()=>{on=false;ctx.clearRect(0,0,W,H);};
}
function cutscene(kind){
  const d=typeof kind==='string'?CS[kind]():kind;
  return new Promise(res=>{
    const ov=$('#cs'),cap=$('#cs-cap'),btn=$('#cs-btn'),timers=[];
    $('#cs-svg').innerHTML='<g class="kb">'+d.svg+'</g>';$('#cs-kicker').textContent=d.kicker||'';cap.classList.add('out');btn.textContent='Skip ▸';
    ov.hidden=false;ov.classList.remove('on');void ov.offsetWidth;ov.classList.add('on');
    let stop=()=>{};timers.push(setTimeout(()=>{stop=particles(d.fx);},d.fxDelay||0));sfx('whoosh');duck(1);if(d.music)d.music();(d.sfx||[]).forEach(([n,ms])=>timers.push(setTimeout(()=>sfx(n),ms)));
    d.caps.forEach((c,i)=>timers.push(setTimeout(()=>{cap.classList.add('out');timers.push(setTimeout(()=>{cap.querySelector('h2').textContent=fill(c[0]);cap.querySelector('p').textContent=fill(c[1]||'');cap.classList.remove('out');if(i===d.caps.length-1)btn.textContent='Continue ▸';},i?700:50));},c[2])));
    const close=()=>{btn.onclick=null;timers.forEach(clearTimeout);stop();duck(0);ov.classList.remove('on');setTimeout(()=>{ov.hidden=true;$('#cs-svg').innerHTML='';res();},450);};

}
