const PA_SCRIPT={"Numberdar Sahib, aj masla bhaari ae. Ghulam Rasool te Allah Ditte de bande aaye ne. Nehri paani da rola ae. Thora khoon vi dul gaya ae... hale tak.": "नंबरदार साहब, अज्ज मसला भारी ए। ग़ुलाम रसूल ते अल्लाह दित्ते दे बंदे आए ने। नहरी पाणी दा रौला ए। थोड़ा ख़ून वी डुल्ल गया ए, हाले तक।", "Kal raat saadi wari si mogay te! Allah Ditte de puttraan ne raat do vajay saada bannaa torh ditta, te mere Asif nu dang maarya. Main parcha karaana ae! Ehnaan nu thaane bhejo!": "कल्ल रात साडी वारी सी मोघे ते! अल्लाह दित्ते दे पुत्तरां ने रात दो वजे साडा बन्ना तोड़ दित्ता, ते मेरे आसिफ़ नूं डांग मारी। मैं पर्चा कटाउणा ए! एहनां नूं थाणे भेजो!", "Numberdar Sahib, tusi bas ik vaari keh deo, main aape nibed lainaan.": "नंबरदार साहब, तुसीं बस इक वारी कह देओ, मैं आपे निबेड़ लैनां।", "Allah gawah ae, Sahib. Tinn saal ton Chaudhry vadh paani lainda pya ae. Ohne SDO nu paise de ke wari badalwa layi. Meri kanak sukk rahi ae.": "अल्लाह गवाह ए, साहब। तिन्न साल तों चौधरी वद्ध पाणी लैंदा पया ए। ओहने एस डी ओ नूं पैसे दे के वारी बदलवा लई। मेरी कणक सुक्क रही ए।", "Sahib, eh 1998 di warabandi ae. Saadi wari lammi ae. Likhya hoya ae.": "साहब, एह उन्नी सौ अठानवे दी वाराबंदी ए। साडी वारी लम्मी ए। लिखया होया ए।", "Sahib, Jattaan de ethay 2,200 vote ne, Araeenaan de 1,400. Ghulam Rasool, Malik Tori da yaar ae. Te SHO Tariq Bhatti udeek reha ae ke tusi kidhar ho, phir parcha likhe ga.": "साहब, जट्टां दे एथे बाई सौ वोट ने, अराईआं दे चौदां सौ। ग़ुलाम रसूल, मलिक तोरी दा यार ए। ते एस एच ओ तारिक़ भट्टी उडीक रेहा ए के तुसीं किद्धर हो, फेर पर्चा लिखेगा।", "Achha, eh ae Numberdar da insaaf? Ik kaagaz, Jatt de khoon ton bhaari ho gaya?": "अच्छा, एह ए नंबरदार दा इंसाफ़? इक काग़ज़, जट्ट दे ख़ून तों भारी हो गया?", "Allah tuhada Dera sada bharya rakhe, Sahib.": "अल्लाह तुहाडा डेरा सदा भरया रक्खे, साहब।", "Sahib... Ghulam Rasool di gaddi Malik Tori de pind val mur gayi ae.": "साहब, ग़ुलाम रसूल दी गड्डी मलिक तोरी दे पिंड वल्ल मुड़ गई ए।", "Tubewell? Phir te larn layi paani hi nahin bachya.": "ट्यूबवैल? फेर ते लड़न लई पाणी ही नहीं बचया।", "Yaaraan saal, Ghulam Rasool. Yaaraan saal asaan ikathe hukka nahin peeta.": "यारां साल, ग़ुलाम रसूल। यारां साल असां इकट्ठे हुक्का नहीं पीता।", "Numberdar Sahib, ik nikki jehi gal ae. Kala Dogar, dangar chor, Mailsi wich tinn parchay. Mera mukhbar kehnda ae oh tuhade canal road waale tubewell te sutta pya ae.": "नंबरदार साहब, इक निक्की जेही गल्ल ए। काला डोगर, डंगर चोर, मैलसी विच तिन्न पर्चे। मेरा मुख़बर कहंदा ए ओह तुहाडे कैनाल रोड वाले ट्यूबवैल ते सुत्ता पया ए।", "Sahib, Kala Dogar, Haji Bashir da bhateeja ae. Haji Bashir ne tuhade marhoom abba nu 300 vote ditte san.": "साहब, काला डोगर, हाजी बशीर दा भतीजा ए। हाजी बशीर ने तुहाडे मरहूम अब्बा नूं तिन्न सौ वोट दित्ते सन।", "DPO sahib sir te charhe hoye ne. Ya main ohnu lai jaanwaan, ya koi navi mobile de tyraan da kharcha de deve te main likh dewaan ke mukhbar ghalat si. Marzi tuhadi.": "डी पी ओ साहब सिर ते चढ़े होए ने। या मैं ओहनूं लै जावां, या कोई नवीं मोबाइल दे टायरां दा ख़र्चा दे देवे ते मैं लिख देवां के मुख़बर ग़लत सी। मर्ज़ी तुहाडी।", "Bari meharbani. DPO sahib nu ajj hi tuhada naa pahunch jaaye ga.": "बड़ी मेहरबानी। डी पी ओ साहब नूं अज्ज ही तुहाडा नां पहुंच जाएगा।", "Sahib, Haji Bashir chah adhi chhad ke chala gaya.": "साहब, हाजी बशीर चाह अद्धी छड्ड के चला गया।", "Lagda ae mukhbar nu ghalat-fehmi ho gayi si.": "लगदा ए मुख़बर नूं ग़लत फ़हमी हो गई सी।", "Numberdar Sahib, hun tusi meri naukri karan lag paye o. Thaane wich kuj bandiyaan nu eh changa nahin lagna.": "नंबरदार साहब, हुण तुसीं मेरी नौकरी करन लग पए हो। थाणे विच कुझ बंदयां नूं एह चंगा नहीं लगणा।", "Numberdar Sahib, mere bande di zameen ae. Baaran kille. Mere puttar Dubai ne. Main hor kidde kol jaawaan?": "नंबरदार साहब, मेरे बंदे दी ज़मीन ए। बारां किल्ले। मेरे पुत्तर दुबई ने। मैं होर किद्दे कोल जावां?", "Sahib, intiqal... intiqal wich March wich Malik Tori de naa bai likhi hoyi ae. Mere register wich ae. Daskhat te angoothe samet.": "साहब, इंतिक़ाल, इंतिक़ाल विच मार्च विच मलिक तोरी दे नां बै लिखी होई ए। मेरे रजिस्टर विच ए। दस्तख़त ते अंगूठे समेत।", "Main zindagi wich kade kuj nahin vechya! Mainu te apna naa likhna nahin aaonda, daskhat kiven kar ditte?": "मैं ज़िंदगी विच कदे कुझ नहीं वेचया! मैनूं ते अपणा नां लिखणा नहीं आउंदा, दस्तख़त किवें कर दित्ते?", "Sahib, patwari har Jummeraat Malik Tori de Dere te roti khaanda ae. Saara pind jaanda ae.": "साहब, पटवारी हर जुमेरात मलिक तोरी दे डेरे ते रोटी खांदा ए। सारा पिंड जाणदा ए।", "Sahib... computer wich... shayad koi hor entry hove...": "साहब, कंप्यूटर विच, शायद कोई होर एंट्री होवे।", "Allah tuhanu sada izzat deve, puttar.": "अल्लाह तुहानूं सदा इज़्ज़त देवे, पुत्तर।", "Tusi bare dil waale o, Sahib. Par Malik Tori agle baaran kille vi mangu ga.": "तुसीं बड़े दिल वाले हो, साहब। पर मलिक तोरी अगले बारां किल्ले वी मंगेगा।", "Numberdar Sahib, sau saal ton saadi biradari neza bazi karwaundi ae. Is saal Malik Tori vi apni ghori lai ke aaya ae. Kehnda ae, Numberdar sirf gaddiyaan wich baithda ae, ghore te nahin.": "नंबरदार साहब, सौ साल तों साडी बिरादरी नेज़ा बाज़ी करवाउंदी ए। इस साल मलिक तोरी वी अपणी घोड़ी लै के आया ए। कहंदा ए, नंबरदार सिर्फ़ गड्डियां विच बैंहदा ए, घोड़े ते नहीं।", "Sahib, tuhada Sultan taiyaar ae. Par neza bazi wich haddiyaan vi tuttdiyaan ne.": "साहब, तुहाडा सुल्तान तैयार ए। पर नेज़ा बाज़ी विच हड्डियां वी टुट्टदियां ने।", "Shabaash! Ajj ton Rajput biradari tuhadi ae, Numberdar Sahib.": "शाबाश! अज्ज तों राजपूत बिरादरी तुहाडी ए, नंबरदार साहब।", "Bari meharbani. Par lok kehnde ne, asal sardar ghore te baithda ae.": "बड़ी मेहरबानी। पर लोक कहंदे ने, असल सरदार घोड़े ते बैंहदा ए।", "Sahib. Malik Tori de bande kal raat Jattaan di chaupal te san. Keh rahe san ke tusi nehri paani shugar mill nu vech ke paise apni jeb wich paa laye.": "साहब। मलिक तोरी दे बंदे कल्ल रात जट्टां दी चौपाल ते सन। कह रहे सन के तुसीं नहरी पाणी शुगर मिल नूं वेच के पैसे अपणी जेब विच पा लए।", "Jhooth ae, par bari tezi naal phail reha ae. Tinn gharaan ne tuhada poster laah ditta ae.": "झूठ ए, पर बड़ी तेज़ी नाल फैल रेहा ए। तिन्न घरां ने तुहाडा पोस्टर लाह दित्ता ए।", "Mainu chhe bande te do Vigo deo. Subah tak us chaupal wich kise nu eh gal yaad nahin rahegi.": "मैनूं छे बंदे ते दो वीगो देओ। सुबह तक उस चौपाल विच किसे नूं एह गल्ल याद नहीं रहेगी।", "Numberdar, tuhadi biryani tuhadi siyasat ton changi ae.": "नंबरदार, तुहाडी बिरयानी तुहाडी सियासत तों चंगी ए।", "Oye Numberdar! Yaad ae Government Primary School wich tera hisaab da kaam kaun nakal karda si? Hun main software banaunda haan. Lahore, Arfa Tower, team lead.": "ओए नंबरदार! याद ए गवर्नमेंट प्राइमरी स्कूल विच तेरा हिसाब दा कम्म कौण नक़ल करदा सी? हुण मैं सॉफ़्टवेयर बणाउंदा हां। लाहौर, अरफ़ा टावर, टीम लीड।", "Main soch reha si. Tera adha din gum hoyiyaan shikayataan wich langh janda ae: nehri wari, zameen da record, police. Mainu do mahine de, main Dere layi app bana dewaan ga. Har case da number hovega.": "मैं सोच रेहा सी। तेरा अद्धा दिन गुम होइयां शिकायतां विच लंघ जांदा ए, नहरी वारी, ज़मीन दा रिकॉर्ड, पुलिस। मैनूं दो महीने दे, मैं डेरे लई ऐप बणा देवांगा। हर केस दा नंबर होवेगा।", "Sahib, app? Adha pind hale vi Nokia chalaanda ae.": "साहब, ऐप? अद्धा पिंड हाले वी नोकिया चलांदा ए।", "Baaki adhe kol WhatsApp ae, Master ji. Shuru karan layi kaafi ae.": "बाक़ी अद्धे कोल वट्सऐप ए, मास्टर जी। शुरू करन लई काफ़ी ए।", "Do mahine. Te pehli shikayat nehri paani di honi chahidi ae.": "दो महीने। ते पहली शिकायत नहरी पाणी दी होणी चाहीदी ए।", "Tere jalse de clip Vehari de har phone te honge. Bas gaana main chunaanga.": "तेरे जलसे दे क्लिप वेहाड़ी दे हर फ़ोन ते होणगे। बस गाणा मैं चुणांगा।", "Sahib, chaar sau ghar. Te tuhadi kamad waala bannaa vi kamzor ae. Saade kol bande te tractor ik jagah layi ne, dowaan layi nahin.": "साहब, चार सौ घर। ते तुहाडी कमाद वाला बन्ना वी कमज़ोर ए। साडे कोल बंदे ते ट्रैक्टर इक जगह लई ने, दोहां लई नहीं।", "Numberdar Sahib, basti de school di chhat dig gayi ae. Bachay masjid di chhat te ne.": "नंबरदार साहब, बस्ती दे स्कूल दी छत डिग्ग गई ए। बच्चे मसीत दी छत ते ने।", "Sahib, eh Mureed Joiya de bande san. Main aawaz pehchaan layi. Malik Tori ne ehnaan nu bheja si.": "साहब, एह मुरीद जोइया दे बंदे सन। मैं आवाज़ पहचाण लई। मलिक तोरी ने एहनां नूं भेजया सी।", "Numberdar Sahib, tees saal ton Joiya saade naal dushmani rakhde ne. Saade tinn puttar is dushmani wich gaye. Hun tuhade te vi goli chal gayi. Hun ki karna ae?": "नंबरदार साहब, तीह साल तों जोइया साडे नाल दुश्मनी रखदे ने। साडे तिन्न पुत्तर इस दुश्मनी विच गए। हुण तुहाडे ते वी गोली चल्ल गई। हुण की करना ए?", "Sahib, je asi badla laiye te eh dushmani agle tees saal chale gi. Te je chup rahiye, lok kehnge Numberdar dar gaya.": "साहब, जे असीं बदला लईए ते एह दुश्मनी अगले तीह साल चलेगी। ते जे चुप्प रहिए, लोक कहणगे नंबरदार डर गया।", "Numberdar, asi Malik Tori di jang lard rahe saan, apni nahin. Ajj ton eh dushmani khatam.": "नंबरदार, असीं मलिक तोरी दी जंग लड़ रहे सां, अपणी नहीं। अज्ज तों एह दुश्मनी ख़त्म।", "Allah tuhanu lammi umar deve.": "अल्लाह तुहानूं लम्मी उमर देवे।", "Numberdar Sahib, Vehari ton Lahore tak lok ikko gal karde ne: is seat da raasta tuhade Dere ton langhda ae.": "नंबरदार साहब, वेहाड़ी तों लाहौर तक लोक इक्को गल्ल करदे ने, इस सीट दा रस्ता तुहाडे डेरे तों लंघदा ए।", "Party nu ethay jittan waala banda chahida ae. Ticket tuhada ho sakda ae. Party de kharche vi ne. Do crore party fund wich, te tuhadi biradari di poori himayat.": "पार्टी नूं एथे जित्तण वाला बंदा चाहीदा ए। टिकट तुहाडा हो सकदा ए। पार्टी दे ख़र्चे वी ने। दो करोड़ पार्टी फ़ंड विच, ते तुहाडी बिरादरी दी पूरी हिमायत।", "Sahib, ticket ton baghair asi Malik Tori te party machine dowaan naal larange.": "साहब, टिकट तों बग़ैर असीं मलिक तोरी ते पार्टी मशीन दोहां नाल लड़ांगे।", "PAI family wich khush aamdeed. Jumme tak notification aa jaaye ga.": "पी ए आई फ़ैमिली विच ख़ुश आमदीद। जुम्मे तक नोटिफ़िकेशन आ जाएगा।", "Numberdar jehra paise di thaan vote naal saudaa karda ae. Theek ae. Ticket tuhada.": "नंबरदार जेहड़ा पैसे दी थां वोट नाल सौदा करदा ए। ठीक ए। टिकट तुहाडा।", "Azad umeedwar aksar jittan ton baad saade kol aaonde ne, Numberdar Sahib. Asi udeekange.": "आज़ाद उम्मीदवार अक्सर जित्तण तों बाद साडे कोल आउंदे ने, नंबरदार साहब। असीं उडीकांगे।", "Sahib, ik masla ae. Malik Tori ne apne jalse layi 70 busaan kiraye te laiyaan ne, isse waqt nehar de us paar. Saadiyaan adhiyaan kursiyaan khaali ne.": "साहब, इक मसला ए। मलिक तोरी ने अपणे जलसे लई सत्तर बसां किराए ते लईआं ने, इसे वेले नहर दे उस पार। साडियां अद्धियां कुर्सियां ख़ाली ने।", "Guten Abend, Numberdar Sahib! Haan, hun main German bolda haan. Panj saal raat diyaan shiftaan te grammar diyaan classaan, banda sab kuj sikh janda ae.": "गूटन आबेंड, नंबरदार साहब! हां, हुण मैं जर्मन बोलदा हां। पंज साल रात दियां शिफ़्टां ते ग्रामर दियां क्लासां, बंदा सब कुझ सिक्ख जांदा ए।", "Sun. Germany wich Vehari te Multan de tinn sau bande ne. Ohnaan ne tera paani waala bhashan vekhya. Oh madad karna chaunde ne.": "सुण। जर्मनी विच वेहाड़ी ते मुल्तान दे तिन्न सौ बंदे ने। ओहनां ने तेरा पाणी वाला भाषण वेखया। ओह मदद करना चाहुंदे ने।", "Asi campaign layi paise bhej sakde haan. Ya main chhuti lai ke wapas aa jaanwaan te tere naal pind pind phiraan. Ya dowein, je tu pyaar naal kahein.": "असीं कैंपेन लई पैसे भेज सकदे हां। या मैं छुट्टी लै के वापस आ जावां ते तेरे नाल पिंड पिंड फिरां। या दोवें, जे तूं प्यार नाल कहें।", "Sahib, bahar gaye munde de har union council wich rishtedaar ne. Jadon Germany ton phone aaonda ae, saara ghar sunda ae.": "साहब, बाहर गए मुंडे दे हर यूनियन कौंसल विच रिश्तेदार ने। जदों जर्मनी तों फ़ोन आउंदा ए, सारा घर सुणदा ए।", "Somvaar nu transfer ho jaayegi. Har euro di bank raseed. Tere mukhaalif zaroor check karange.": "सोमवार नूं ट्रांसफ़र हो जाएगी। हर यूरो दी बैंक रसीद। तेरे मुख़ालिफ़ ज़रूर चैक करनगे।", "Jummeraat nu Lahore airport. Gul Khan nu bhejin, Land Cruiser nahin. Main aam bande wangoon aana chaunda haan.": "जुमेरात नूं लाहौर एयरपोर्ट। गुल ख़ान नूं भेजीं, लैंड क्रूज़र नहीं। मैं आम बंदे वांगूं आउणा चाहुंदा हां।", "Solar pump, German engineer, Pakistani frame. Kisaan da diesel bachega, te har pump te tera naa.": "सोलर पंप, जर्मन इंजीनियर, पाकिस्तानी फ़्रेम। किसान दा डीज़ल बचेगा, ते हर पंप ते तेरा नां।", "Main chaali siyasatdaanaan da interview kitta ae. Tusi pehle o jinhaan camera band karan nu nahin kiha.": "मैं चाली सियासतदानां दा इंटरव्यू कीता ए। तुसीं पहले हो जिन्हां कैमरा बंद करन नूं नहीं केहा।", "Baaran hazaar case, taareekhaan samet. Eh story te hun tuhade haq wich ban gayi ae.": "बारां हज़ार केस, तारीख़ां समेत। एह स्टोरी ते हुण तुहाडे हक़ विच बण गई ए।", "Numberdar Sahib! Daakuaan ne mere bhateeje de das dangar khol laye, te ohde puttar nu vi chukk ke lai gaye. Darya wal nasse ne.": "नंबरदार साहब! डाकूआं ने मेरे भतीजे दे दस डंगर खोल लए, ते ओहदे पुत्तर नूं वी चुक्क के लै गए। दरिया वल्ल नस्से ने।", "Sahib, police nu pahunchan wich chaar ghante lagne ne. Ghore taiyaar ne. Kacha wich gaddi nahin jaandi.": "साहब, पुलिस नूं पहुंचण विच चार घंटे लगणे ने। घोड़े तैयार ने। कच्चे विच गड्डी नहीं जांदी।", "Allah tuhanu sada salaamat rakhe. Kamboh biradari eh ehsaan kade nahin bhulle gi.": "अल्लाह तुहानूं सदा सलामत रक्खे। कंबोह बिरादरी एह एहसान कदे नहीं भुल्लेगी।", "Munda te ghar aa gaya, Numberdar Sahib. Par daaku hun jaande ne ke paisa kitthon milda ae.": "मुंडा ते घर आ गया, नंबरदार साहब। पर डाकू हुण जाणदे ने के पैसा कित्थों मिलदा ए।", "Numberdar. Is nehar de do kinaare ne. Tu apne te reh, main apne te, te tinn hafte baad lok faisla karange.": "नंबरदार। इस नहर दे दो किनारे ने। तूं अपणे ते रह, मैं अपणे ते, ते तिन्न हफ़्ते बाद लोक फ़ैसला करनगे।", "Ya phir... paisa zaaya karna chhad. Baith ja. Main tere bandiyaan nu district council diyaan seataan dila dewaanga. Sab da faida.": "या फेर, पैसा ज़ाया करना छड्ड। बैठ जा। मैं तेरे बंदयां नूं डिस्ट्रिक्ट कौंसल दियां सीटां दिला देवांगा। सब दा फ़ायदा।", "Sahib, ohde bandiyaan de hath chaadraan de thalle ne. Saadiyaan de vi.": "साहब, ओहदे बंदयां दे हत्थ चादरां दे थल्ले ने। साडयां दे वी।", "Saaf larai. Theek ae. Vekhange haar ke vi tainu eh asool changa lagda ae ke nahin.": "साफ़ लड़ाई। ठीक ए। वेखांगे हार के वी तैनूं एह असूल चंगा लगदा ए के नहीं।", "Main dost ban ke aaya haan, Numberdar Sahib. Malik Tori de bande 112 te 113 number station te tinn vajay ton baad thappe laaun di koshish karange. Mere sipahi othay ne. Oh akkhaan band kar sakde ne, ohde layi ya tuhade layi.": "मैं दोस्त बण के आया हां, नंबरदार साहब। मलिक तोरी दे बंदे इक सौ बारां ते इक सौ तेरां नंबर स्टेशन ते तिन्न वजे तों बाद ठप्पे लाउण दी कोशिश करनगे। मेरे सिपाही ओथे ने। ओह अक्खां बंद कर सकदे ने, ओहदे लई या तुहाडे लई।", "Sahib, asi subah tak 112 te chaali bande khare kar sakde haan.": "साहब, असीं सुबह तक इक सौ बारां ते चाली बंदे खड़े कर सकदे हां।", "Ho gaya samjho. Yaad rakhna ajj raat tuhade dost kaun san.": "हो गया समझो। याद रखणा अज्ज रात तुहाडे दोस्त कौण सन।", "Sahib, 214 wichon 180 station gin laye ne. Bara nerre da muqabla ae. Bahut nerre.": "साहब, दो सौ चौदां विचों इक सौ असी स्टेशन गिण लए ने। बड़ा नेड़े दा मुक़ाबला ए। बहुत नेड़े।", "Sahib... tusi 23,418 votaan naal jitt gaye! Malik Tori press naal gal kitte baghair ghar chala gaya.": "साहब, तुसीं तेई हज़ार चार सौ अठारां वोटां नाल जित्त गए! मलिक तोरी प्रेस नाल गल्ल कीते बग़ैर घर चला गया।", "Sahib, Malik Tori 3,112 votaan naal jitt gaya. Nau stationaan te gadbad si. Asi petition kar sakde haan.": "साहब, मलिक तोरी तिन्न हज़ार इक सौ बारां वोटां नाल जित्त गया। नौं स्टेशनां ते गड़बड़ सी। असीं पटीशन कर सकदे हां।", "Sahib, oh Pani te Bijli di wazaarat de rahe ne.": "साहब, ओह पाणी ते बिजली दी वज़ारत दे रहे ने।", "Wazir Sahib. Somvaar nu Aiwan-e-Sadr wich halaf.": "वज़ीर साहब। सोमवार नूं ऐवान ए सदर विच हलफ़।", "Tusi bahut tez sikh gaye o, Numberdar Sahib. Kuj bandiyaan layi zyada hi tez.": "तुसीं बहुत तेज़ सिक्ख गए हो, नंबरदार साहब। कुझ बंदयां लई ज़्यादा ही तेज़।", "Numberdar Sahib, mulk nu mazboot bandiyaan di lorr ae. Ohnaan bandiyaan di jehre samajhde ne ke kuj filaan band hi changiyaan ne.": "नंबरदार साहब, मुल्क नूं मज़बूत बंदयां दी लोड़ ए। ओहनां बंदयां दी जेहड़े समझदे ने के कुझ फ़ाइलां बंद ही चंगियां ने।", "Tuhada naa uchi kursi layi lia ja reha ae. Istehkaam is gal nu agge vadhaunda ae. Bechaini nahin.": "तुहाडा नां उच्ची कुर्सी लई लया जा रेहा ए। इस्तेहकाम इस गल्ल नूं अग्गे वधाउंदा ए। बेचैनी नहीं।", "Changa. Asi ik doje nu samajh gaye.": "चंगा। असीं इक दूजे नूं समझ गए।", "Dalair o. Vekhange siyaane vi o ke nahin.": "दलेर हो। वेखांगे सियाणे वी हो के नहीं।", "Paani. Haan. Paani te sab mannde ne. Draft bhejo.": "पाणी। हां। पाणी ते सब मन्नदे ने। ड्राफ़्ट भेजो।", "Sahib, kisaan unionaan kehngiyaan ke tusi darya vech ditta.": "साहब, किसान यूनियनां कहणगियां के तुसीं दरिया वेच दित्ता।", "Main kiha si na, German engineeraan nu aukha darya bahut pasand ae.": "मैं केहा सी ना, जर्मन इंजीनियरां नूं औखा दरिया बहुत पसंद ए।", "Numberdar de apne Dere diyaan recordingaan. Qaum sune ke oh asal wich kiven hakoomat karda ae.": "नंबरदार दे अपणे डेरे दियां रिकॉर्डिंगां। क़ौम सुणे के ओह असल विच किवें हकूमत करदा ए।", "Har channel tuhade jawab di udeek wich ae, Numberdar Sahib. Main tuhanu nau vajay da slot de sakdi haan, live.": "हर चैनल तुहाडे जवाब दी उडीक विच ए, नंबरदार साहब। मैं तुहानूं नौं वजे दा स्लॉट दे सकदी हां, लाइव।", "Eh channel di tareekh da sab ton zyada vekhya gaya ghanta si.": "एह चैनल दी तारीख़ दा सब तों ज़्यादा वेखया गया घंटा सी।", "Baaran hazaar case. Search karo, jo labhna ae labh lo.": "बारां हज़ार केस। सर्च करो, जो लभणा ए लभ लओ।", "Je ginti poori rahi te coalition tuhada naa dewegi. Kuj member yaqeen dihaani mangde ne. Kuj lifaafe.": "जे गिणती पूरी रही ते कोलिशन तुहाडा नां देवेगी। कुझ मेंबर यक़ीन दिहानी मंगदे ने। कुझ लिफ़ाफ़े।", "Sahib, eh aakhri faisla ae. Is ton baad Dera poora mulk ban jaanda ae.": "साहब, एह आख़री फ़ैसला ए। इस तों बाद डेरा पूरा मुल्क बण जांदा ए।", "Sahib. Hukam karo.": "साहब। हुक्म करो।", "Sahib, je eh gal phail gayi, biradariyaan saade naal nahin kharhangiyaan.": "साहब, जे एह गल्ल फैल गई, बिरादरियां साडे नाल नहीं खड़नगियां।", "Sahib, Jumme nu meri dhee da viah ae. Tusi aao ge te saari biradari vich meri izzat vadh jaayegi.": "साहब, जुम्मे नूं मेरी धी दा वियाह ए। तुसीं आओगे ते सारी बिरादरी विच मेरी इज़्ज़त वध जाएगी।", "Sahib, salami di rasam ae. Lok vekhde ne Numberdar ne kinna ditta.": "साहब, सलामी दी रस्म ए। लोक वेखदे ने नंबरदार ने कितना दित्ता।", "Sahib, mera sir uchaa kar ditta tusi.": "साहब, मेरा सिर उच्चा कर दित्ता तुसीं।", "Numberdar Sahib, arhti ne pichhli fasal da qarza vadha ke dugna kar ditta. Je main na diya te meri do killiyaan lai lavega.": "नंबरदार साहब, आढ़ती ने पिछली फ़सल दा क़र्ज़ा वधा के दुगणा कर दित्ता। जे मैं ना दित्ता ते मेरी दो किल्लियां लै लवेगा।", "Sahib, kaarobaar ae... theek ae, asal hi lai lawaanga.": "साहब, कारोबार ए, ठीक ए, असल ही लै लवांगा।", "Puttar, WAPDA ne mere tubewell da do lakh da bill bhej ditta. Motor te chhe mahine ton band ae!": "पुत्तर, वापडा ने मेरे ट्यूबवैल दा दो लक्ख दा बिल भेज दित्ता। मोटर ते छे महीने तों बंद ए!", "Case number 1,207. XEN ne do ghante wich theek kar ditta.": "केस नंबर बारां सौ सत्त। एक्सियन ने दो घंटे विच ठीक कर दित्ता।", "Numberdar Sahib, mandi wich rate 8,200 ae. Main tuhanu 7,900 de sakda haan, ajj hi naqad.": "नंबरदार साहब, मंडी विच रेट बयासी सौ ए। मैं तुहानूं उनासी सौ दे सकदा हां, अज्ज ही नक़द।", "Sahib, Multan di mill 8,600 dendi ae, par trolley te diesel apna.": "साहब, मुल्तान दी मिल छयासी सौ देंदी ए, पर ट्रॉली ते डीज़ल अपणा।", "Numberdar Sahib, Chak 9 de naal kabaddi da muqabla ae. Saade jawaan bina boot de khed rahe ne.": "नंबरदार साहब, चक नौं दे नाल कबड्डी दा मुक़ाबला ए। साडे जवान बिना बूट दे खेड रहे ने।", "Sahib, Malik Tori ne Chak 9 waaliyaan nu navi kit dilaayi ae.": "साहब, मलिक तोरी ने चक नौं वालयां नूं नवीं किट दिलाई ए।", "Numberdar Sahib, mainu Lahore di university wich computer science wich daakhla mil gaya ae. Par fees...": "नंबरदार साहब, मैनूं लाहौर दी यूनिवर्सिटी विच कंप्यूटर साइंस विच दाख़ला मिल गया ए। पर फ़ीस।", "Sahib, kuri zyada parh gayi te rishta kaun karega? Pind wich lok gallan karange.": "साहब, कुड़ी ज़्यादा पढ़ गई ते रिश्ता कौण करेगा? पिंड विच लोक गल्लां करनगे।", "Main pehli kuri haan pind di jehri engineer banegi. Shukriya.": "मैं पहली कुड़ी हां पिंड दी जेहड़ी इंजीनियर बणेगी। शुक्रिया।", "Sahib, Murabba 22 de das kille vikde ne. Malik Tori vi puchh reha si.": "साहब, मुरब्बा बाई दे दस किल्ले विकदे ने। मलिक तोरी वी पुच्छ रेहा सी।", "Sahib, nehar de naal ae. Pakki zameen.": "साहब, नहर दे नाल ए। पक्की ज़मीन।", "Numberdar Sahib, tees ghar bachiyaan nu qatre pilaun ton inkaar kar rahe ne. Afwaahaan phaili hoyiyaan ne.": "नंबरदार साहब, तीह घर बच्चियां नूं क़तरे पिलाउण तों इनकार कर रहे ने। अफ़वाहां फैलियां होइयां ने।", "Ji Numberdar Sahib, jiven tusi kaho. Koi parcha nahin.": "जी नंबरदार साहब, जिवें तुसीं कहो। कोई पर्चा नहीं।", "Mere kol ik video ae, Numberdar Sahib. Tuhadiyaan Vigo, Jattaan di chaupal, raat de do vaje. Nau vaje chalan ton pehlaan kuj kehna chaunde o?": "मेरे कोल इक वीडियो ए, नंबरदार साहब। तुहाडियां वीगो, जट्टां दी चौपाल, रात दे दो वजे। नौं वजे चलण तों पहलां कुझ कहणा चाहुंदे हो?", "Mere kol kaagaz ne ke 2009 wich tuhade khaandaan de zameen record badle gaye san. Nau vaje chalan ton pehlaan kuj kehna chaunde o?": "मेरे कोल काग़ज़ ने के दो हज़ार नौं विच तुहाडे ख़ानदान दे ज़मीन रिकॉर्ड बदले गए सन। नौं वजे चलण तों पहलां कुझ कहणा चाहुंदे हो?", "Numberdar, Germany waale saare jaag rahe ne! Frankfurt wich vi TV laga hoya ae.": "नंबरदार, जर्मनी वाले सारे जाग रहे ने! फ़्रैंकफ़र्ट विच वी टीवी लग्गा होया ए।", "Ich bin so stolz! Main kiha si na, yaar!": "इश बिन ज़ो श्टोल्ज़! मैं केहा सी ना, यार!", "Helpline te ik ghante wich das hazaar mubarakaan aa gaiyaan ne!": "हैल्पलाइन ते इक घंटे विच दस हज़ार मुबारकां आ गईआं ने!", "Coalition nu do seataan ghatt ne. Tusi chupke naal aath azad member apne naal kar laye ne. Party nu ohnaan di lorr ae, Numberdar Sahib.": "कोलिशन नूं दो सीटां घट्ट ने। तुसीं चुपके नाल अट्ठ आज़ाद मेंबर अपणे नाल कर लए ने। पार्टी नूं ओहनां दी लोड़ ए, नंबरदार साहब।", "Asi kiha si na, azad member jittan ton baad saade kol aaonde ne. Coalition nu do seataan ghatt ne, te aath member tuhadi gal mannde ne.": "असीं केहा सी ना, आज़ाद मेंबर जित्तण तों बाद साडे कोल आउंदे ने। कोलिशन नूं दो सीटां घट्ट ने, ते अट्ठ मेंबर तुहाडी गल्ल मन्नदे ने।", "Sahib, thalle! Gaddi de pichhe ho jao! Eh Joiya de bande ne!": "साहब, थल्ले! गड्डी दे पिच्छे हो जाओ! एह जोइया दे बंदे ने!", "Sahib, main gaddi bhaja sakda haan. Bas hukam karo!": "साहब, मैं गड्डी भजा सकदा हां। बस हुक्म करो!", "Shabaash Sahib! Oh kamad wich nass gaye!": "शाबाश साहब! ओह कमाद विच नस्स गए!", "Sahib! Malik Tori de bande deewaar te charh rahe ne! Das ton vadh ne!": "साहब! मलिक तोरी दे बंदे कंध ते चढ़ रहे ने! दस तों वद्ध ने!", "Sahib, main DPO nu phone karda haan. Tusi andar raho!": "साहब, मैं डी पी ओ नूं फ़ोन करदा हां। तुसीं अंदर रहो!", "Numberdar Sahib, ajj saare zile nu pata lag gaya ke is Dere te hath paauna maut nu sadda dena ae.": "नंबरदार साहब, अज्ज सारे ज़िले नूं पता लग्ग गया के इस डेरे ते हत्थ पाउणा मौत नूं सद्दा देणा ए।", "Salaam Numberdar Sahib! Is saal fasal bari changi ae.": "सलाम नंबरदार साहब! इस साल फ़सल बड़ी चंगी ए।", "Numberdar Sahib, mera puttar Dubai jaana chaunda ae. Dua karna.": "नंबरदार साहब, मेरा पुत्तर दुबई जाणा चाहुंदा ए। दुआ करना।", "Malik Tori de bande kal phir pind de baahr phir rahe san.": "मलिक तोरी दे बंदे कल्ल फेर पिंड दे बाहर फिर रहे सन।", "Bijli ajj vi nahin aayi, Sahib. WAPDA waaliyaan nu kuj kaho.": "बिजली अज्ज वी नहीं आई, साहब। वापडा वालयां नूं कुझ कहो।", "Tuhada Sultan pind da sab ton sohna ghora ae!": "तुहाडा सुल्तान पिंड दा सब तों सोहणा घोड़ा ए!", "Sahib, school di chhat di marammat kadon hovegi?": "साहब, स्कूल दी छत दी मरम्मत कदों होवेगी?", "Chah pee ke jaana, Numberdar Sahib! Ithe hi bah jao.": "चाह पी के जाणा, नंबरदार साहब! एथे ही बह जाओ।", "Numberdar Sahib, nehri paani is wari poora aaya. Tuhadi meharbani.": "नंबरदार साहब, नहरी पाणी इस वारी पूरा आया। तुहाडी मेहरबानी।", "Numberdar chacha! Saanu vi Sultan te bithao!": "नंबरदार चाचा! सानूं वी सुल्तान ते बिठाओ!", "Aao Numberdar Sahib, hukka taaza ae. Baitho.": "आओ नंबरदार साहब, हुक्का ताज़ा ए। बैठो।", "Numberdar, tuhada tubewell waala faisla saare pind ne yaad rakhya ae.": "नंबरदार, तुहाडा ट्यूबवैल वाला फ़ैसला सारे पिंड ने याद रखया ए।", "Sahib, doodh-patti tayyar ae! Garam garam.": "साहब, दुद्ध पत्ती तैयार ए! गर्म गर्म।", "Numberdar Sahib, thalle ho jao! Oh trolley de pichhe ne!": "नंबरदार साहब, थल्ले हो जाओ! ओह ट्रॉली दे पिच्छे ने!", "Hor aa rahe ne! Kamad wichon!": "होर आ रहे ने! कमाद विचों!", "Aakhri hamla ae, Sahib! Datt ke khare raho!": "आख़री हमला ए, साहब! डट्ट के खड़े रहो!", "Sahib! Gaddi de pichhe! Kamad wichon goliyaan aa rahiyaan ne!": "साहब! गड्डी दे पिच्छे! कमाद विचों गोलियां आ रहियां ने!", "Ohnaan de hor bande trolley kol ne!": "ओहनां दे होर बंदे ट्रॉली कोल ने!", "Wah! Bilu di chah da koi jawaab nahin.": "वाह! बिलू दी चाह दा कोई जवाब नहीं।", "Ho gaya, Sahib. Jiven tusi farmaaya.": "हो गया, साहब। जिवें तुसीं फ़रमाया।", "Chacha, kabaddi wich asi jitt gaye!": "चाचा, कबड्डी विच असीं जित्त गए!"};
function toGurmukhi(s){
  const SP={'\u0937':'\u0A36','\u0949':'\u0A4B','\u0945':'\u0A48','\u090B':'\u0A30\u0A3F','\u0958':'\u0A15','\u0959':'\u0A59','\u095A':'\u0A5A','\u095B':'\u0A5B','\u095C':'\u0A5C','\u095D':'\u0A5C','\u095E':'\u0A5E','\u0964':'\u0964','\u0965':'\u0965'};
  let o='';for(const ch of s){const c=ch.codePointAt(0);o+=SP[ch]!==undefined?SP[ch]:(c>=0x900&&c<=0x97F?String.fromCodePoint(c+0x100):ch);}
  o=o.replace(/\u0A21\u0A3C/g,'\u0A5C').replace(/\u0A22\u0A3C/g,'\u0A5C').replace(/\u0A15\u0A3C/g,'\u0A15').replace(/\u0A2F\u0A3C/g,'\u0A2F');
  const ASP={'ਕ':'ਖ','ਗ':'ਘ','ਚ':'ਛ','ਜ':'ਝ','ਟ':'ਠ','ਡ':'ਢ','ਤ':'ਥ','ਦ':'ਧ','ਪ':'ਫ','ਬ':'ਭ'};
  o=o.replace(/([\u0A15-\u0A39])\u0A4D([\u0A15-\u0A39])/g,(m,a,b)=>a===b||ASP[a]===b?'\u0A71'+b:m);
  return o.replace(/([\u0A15-\u0A39\u0A3F\u0A41\u0A05\u0A07\u0A09])\u0A02/g,'$1\u0A70');
}
function toUrdu(s){
  const C={'क':'ک','ख':'کھ','ग':'گ','घ':'گھ','ङ':'ن','च':'چ','छ':'چھ','ज':'ج','झ':'جھ','ञ':'ن','ट':'ٹ','ठ':'ٹھ','ड':'ڈ','ढ':'ڈھ','ण':'ن','त':'ت','थ':'تھ','द':'د','ध':'دھ','न':'ن','प':'پ','फ':'پھ','ब':'ب','भ':'بھ','म':'م','य':'ی','र':'ر','ल':'ل','व':'و','श':'ش','ष':'ش','स':'س','ह':'ہ','ळ':'ل'};
  const N={'क':'ق','ख':'خ','ग':'غ','ज':'ز','फ':'ف','ड':'ڑ','ढ':'ڑھ','य':'ی'},PRE={'क़':'ق','ख़':'خ','ग़':'غ','ज़':'ز','ड़':'ڑ','ढ़':'ڑھ','फ़':'ف'};
  const VI={'अ':'ا','आ':'آ','इ':'ا','ई':'ای','उ':'ا','ऊ':'او','ए':'اے','ऐ':'اے','ओ':'او','औ':'او'},VM={'अ':'','आ':'ا','इ':'ئ','ई':'ئی','उ':'ؤ','ऊ':'ؤ','ए':'ئے','ऐ':'ئے','ओ':'ؤ','औ':'ؤ'};
  const M={'ा':'ا','ि':'','ी':'ی','ु':'','ू':'و','े':'ے','ै':'ے','ो':'و','ौ':'و','ॉ':'ا','ं':'ں','ँ':'ں','्':'','़':''},P={'।':'۔','?':'؟',',':'،'};
  return s.split(/(\s+)/).map(w=>{if(/^\s+$/.test(w))return w;const ch=[...w];let o='';
    for(let i=0;i<ch.length;i++){const c=ch[i],nx=ch[i+1];
      if(PRE[c]){o+=PRE[c];continue;}
      if(C[c]&&nx==='\u094D'&&ch[i+2]&&C[ch[i+2]]&&(ch[i+2]===c||C[ch[i+2]]===C[c]+'ھ')){const d=C[ch[i+2]];o+=d[0]+'\u0651'+d.slice(1);i+=2;continue;}
      if(C[c]){if(nx==='\u093C'&&N[c]){o+=N[c];i++;}else o+=C[c];continue;}
      if(VI[c]){o+=o.length?VM[c]:VI[c];continue;}
      if(M[c]!==undefined){o+=M[c];continue;}
      o+=P[c]!==undefined?P[c]:c;}
    return o.replace(/ے(?=[^\s۔؟،!.]+)/g,'ی').replace(/ں(?=[^\s۔؟،!.]+)/g,'ن');}).join('');
}
let voiceHinted=false;
function noVoiceHint(){if(voiceHinted)return;voiceHinted=true;toast('No Punjabi, Urdu or Hindi voice found',NATIVE?'Install Urdu, Hindi or Punjabi voice data in Settings → Text-to-speech (Speech Services by Google). Until then characters use voice sounds.':'Install an Urdu, Hindi or Punjabi voice in your system speech settings, or use Microsoft Edge or Chrome. Until then characters use voice sounds.');}
function speechScript(l,text){return l.dv||PA_SCRIPT[l.t]||PA_SCRIPT[text]||null;}
function langOf(v){return String(v.lang||v).toLowerCase().replace('_','-');}
function indicPick(female,who){
  const fem=/female|woman|zira|heera|swara|kalpana|veena|neerja|lekha|aditi|uzma|salma|gul|ananya|vaani|google/i,mal=/\bmale|ravi|madhur|hemant|prabhat|rishi|asad|arjun|kunal|ojas|aarav|salman/i;
  for(const k of ['pa','ur','hi']){const vs=TTS.voices.filter(v=>langOf(v).startsWith(k));if(!vs.length)continue;
    let pool=vs.filter(v=>(female?fem:mal).test(v.name));if(!pool.length)pool=vs;
    pool.sort((a,b)=>(/natural|neural|online|google/i.test(b.name)?1:0)-(/natural|neural|online|google/i.test(a.name)?1:0));
    let h=0;for(const ch of (who||''))h=(h*31+ch.charCodeAt(0))>>>0;const best=pool.filter(v=>/natural|neural|online|google/i.test(v.name));const v=(best.length?best:pool)[h%(best.length||pool.length)];
    return{v,kind:k};}
  return null;
}
function forKind(kind,dv){return kind==='pa'?toGurmukhi(dv):kind==='ur'?toUrdu(dv):dv;}
function speak(l,text){
  if(typeof NATIVE!=='undefined'&&NATIVE)return nativeSpeak(l,text);
  if(TTS.mode==='off'||!window.speechSynthesis||!soundOn)return false;
  try{
    speechSynthesis.cancel();if(!TTS.voices.length)loadVoices();
    const nar=!l.who||l.who==='nar',female=FEMALE.has(l.who);let txt,v;
    if(TTS.mode==='en'){txt=fill(l.en||l.t);v=pickVoice('en',female,l.who);}
    else{if(nar)return false;const dv=speechScript(l,text),iv=indicPick(female,l.who);if(!dv)return false;if(!iv){noVoiceHint();return false;}v=iv.v;txt=forKind(iv.kind,dv);}
    const u=new SpeechSynthesisUtterance(txt.replace(/["“”]/g,''));if(v){try{u.voice=v;}catch(e){}u.lang=v.lang;}
    const [p,r]=VP[l.who]||[1,1];u.pitch=clampN(p*(female?1.08:1),.5,1.6);u.rate=clampN(r*.92,.6,1.3);u.volume=1;
    u.onstart=()=>duck(1);u.onend=u.onerror=()=>{duck(0);$('#portrait').classList.remove('talk');};
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}

/* ============ BOOT ============ */
function boot(d){
  S=DEF();buildScene();leaves();ambInit();stwInit();makeGrain();bind();nativeInit();
  if(d&&d.S)S=Object.assign(DEF(),d.S);
  renderHUD();setScene(EV[S.ev]||EV.water);
  $('#portrait').innerHTML=portrait(CH.nar);$('#who').textContent=CH.nar.name;$('#role').textContent=CH.nar.role;
  $('#text').textContent='Sixty villagers are waiting at the Dera. Open the gates to begin.';
  if(d&&d.S&&EV[S.ev]&&!EV[S.ev].end)beginGame();else titleScreen();
}
try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
